<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多标的分时对比 · 板块/个股/指数</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  /* ===== 浅色简洁专业风 · 设计令牌 ===== */
  :root {
    --bg: #f5f7fa;              /* 页面底色（浅灰） */
    --surface: #ffffff;          /* 卡片 / 面板 */
    --surface-2: #fafbfc;        /* 次级面 */
    --hover: #eef2f7;            /* 悬停 */
    --brand-subtle: #eaf1ff;     /* 品牌弱底 */
    --border: #e5e9ef;           /* 常规描边 */
    --border-strong: #c9d3e0;    /* 强描边 / 分隔 */
    --border-subtle: #eef1f5;    /* 弱描边 */

    --text-1: #1f2530;           /* 主文字 */
    --text-2: #5b6675;           /* 次文字 */
    --text-3: #9aa4b2;           /* 弱文字 */

    --brand: #2563eb;            /* 品牌蓝 */
    --brand-ink: #1a56d6;
    --stock: #0e9aa7;            /* 个股青 */
    --etf: #d97706;              /* ETF 琥珀 */

    --up: #e5484d;               /* 涨（红） */
    --up-text: #d9363e;
    --down: #18a058;             /* 跌（绿） */
    --down-text: #178a4f;
    --flat: #9aa4b2;
    --avg-line: #10a3a8;         /* 均价线 */
    --pre-line: #b3bcc9;         /* 昨收线 */

    --shadow-sm: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --radius: 10px;
    --radius-sm: 7px;
    --radius-pill: 999px;

    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Hiragino Sans GB", Roboto, Arial, sans-serif;
    --font-num: "DIN Alternate", "Bahnschrift", "Segoe UI", "PingFang SC",
                "Microsoft YaHei", Consolas, "Liberation Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; height: 100%; }

  body {
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-sans);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d3dae4; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #c0c9d6; }
  ::-webkit-scrollbar-track { background: transparent; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }

  /* ===== 页面骨架 ===== */
  #app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
  }

  /* ===== 顶栏 ===== */
  header {
    flex: none;
    display: flex;
    align-items: center;
    align-content: flex-start;
    gap: 6px 18px;
    flex-wrap: wrap;
    padding: 8px 18px;
    min-height: 64px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .brand .sub { font-size: 12px; color: var(--text-3); letter-spacing: 1px; }
  .sep { width: 1px; height: 22px; background: var(--border); }

  .seg { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 3px; background: var(--surface-2); gap: 2px; }
  .seg button { padding: 5px 13px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; transition: background .15s, color .15s; }
  .seg button:hover { color: var(--text-1); }
  .seg button.is-on { background: var(--surface); color: var(--brand-ink); box-shadow: 0 1px 2px rgba(16,24,40,.08); }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border: 1px solid var(--border); border-radius: var(--radius-pill); font-size: 13px; font-weight: 500; color: var(--text-2); background: var(--surface); transition: background .15s, color .15s, border-color .15s; }
  .chip:hover { background: var(--hover); color: var(--text-1); }
  .chip:not(:disabled):active { transform: scale(.96); }
  .chip.is-on { border-color: #b9cbff; background: var(--brand-subtle); color: var(--brand-ink); }
  .chip:disabled { opacity: .6; cursor: default; }
  .chip.is-spinning { opacity: .7; }
  .chip.is-danger:not(:disabled):hover { border-color: #f3c1c4; color: var(--up-text); background: #fdf0f0; }

  .tool-caption { font-size: 12px; color: var(--text-3); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-3); white-space: nowrap; }
  .status .tag { color: var(--text-2); font-weight: 500; }
  .status .tag.is-live { color: var(--up-text); font-weight: 600; }
  .status .count { font-family: var(--font-num); padding: 2px 10px; border-radius: var(--radius-pill); background: var(--surface-2); border: 1px solid var(--border-subtle); color: var(--text-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .dot.is-live { background: var(--up-text); box-shadow: 0 0 0 3px rgba(217,54,62,.15); }
  .status .time { font-family: var(--font-num); }

  /* ===== 数据日期组件（显示当前分时对应日期 + 前后切换 + 日期选择） ===== */
  .datebox { display: inline-flex; align-items: stretch; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); overflow: hidden; flex: none; }
  .datebox:hover { border-color: var(--border-strong); }
  .datebox__btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; color: var(--text-3); font-size: 16px; line-height: 1; transition: background .15s, color .15s; }
  .datebox__btn:hover:not(:disabled) { background: var(--hover); color: var(--brand-ink); }
  .datebox__btn:disabled { opacity: .35; cursor: default; }
  .datebox__main { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; min-width: 138px; padding: 3px 10px; border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); text-align: left; transition: background .15s; }
  .datebox__main:hover { background: var(--hover); }
  .datebox__l1 { font-family: var(--font-num); font-size: 14px; font-weight: 700; color: var(--text-1); letter-spacing: .2px; line-height: 1; white-space: nowrap; }
  .datebox__l2 { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); line-height: 1; white-space: nowrap; }
  .datebox__tag { display: inline-flex; align-items: center; height: 15px; padding: 0 6px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 600; letter-spacing: .5px; }
  .datebox__tag.is-live { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border-subtle); }
  .datebox__tag.is-hist { background: var(--brand-subtle); color: var(--brand-ink); border: 1px solid #cfe0ff; }
  .datebox.is-hist .datebox__l1 { color: var(--brand-ink); }
  .datebox__today { display: inline-flex; align-items: center; justify-content: center; width: 30px; font-size: 12px; font-weight: 600; color: var(--text-2); transition: background .15s, color .15s; }
  .datebox__today:hover:not(:disabled) { background: var(--brand-subtle); color: var(--brand-ink); }
  .datebox__today:disabled { opacity: .35; cursor: default; }
  .datebox__input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* ===== 主体 ===== */
  main { flex: 1; min-height: 0; display: flex; gap: 12px; }

  /* —— 左面板 —— */
  .panel {
    width: 348px; flex: none;
    display: flex; flex-direction: column; min-height: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .tabs { flex: none; display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 500; color: var(--text-2); border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--text-1); }
  .tab.is-active { color: var(--brand-ink); font-weight: 600; border-bottom-color: var(--brand); }

  .panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .btns { flex: none; display: flex; gap: 6px; padding: 10px 12px 4px; flex-wrap: wrap; }
  .mini-btn { padding: 4px 10px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500; color: var(--text-2); border: 1px solid var(--border); background: var(--surface); transition: background .15s, color .15s, border-color .15s; }
  .mini-btn:hover { background: var(--hover); }
  .mini-btn.is-on { border-color: #b9cbff; background: var(--brand-subtle); color: var(--brand-ink); }

  .search { flex: none; display: flex; align-items: center; gap: 6px; margin: 8px 12px 6px; padding: 0 10px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); }
  .search svg { color: var(--text-3); flex: none; }
  .search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--text-1); font-size: 13px; }
  .search input::placeholder { color: var(--text-3); }
  .kw-clear { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; color: var(--text-3); transition: color .15s, background .15s; }
  .kw-clear:hover { color: var(--text-1); background: var(--hover); }

  .mkrow { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 6px; }
  .mkrow .seg button { padding: 4px 11px; font-size: 12px; }

  .hint { flex: none; padding: 14px; text-align: center; color: var(--text-3); font-size: 13px; }

  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 8px 8px; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; border-radius: var(--radius-sm); font-size: 13px; text-align: left; }
  .item:hover { background: var(--hover); }
  .item.is-on { background: var(--brand-subtle); }
  .check { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex: none; border: 1px solid var(--border-strong); border-radius: 4px; color: #fff; }
  .item.is-on .check { background: var(--brand); border-color: var(--brand); }
  .check svg { display: none; }
  .item.is-on .check svg { display: block; }
  .item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-1); font-weight: 500; }
  .item-code { font-family: var(--font-num); font-size: 11px; color: var(--text-3); margin-left: 6px; flex: none; white-space: nowrap; }
  .item-tag { flex: none; padding: 1px 6px; border-radius: 999px; font-size: 11px; color: var(--brand-ink); background: var(--brand-subtle); border: 1px solid #cfe0ff; white-space: nowrap; }
  .item-pct { font-family: var(--font-num); font-size: 12px; font-weight: 600; width: 56px; text-align: right; }
  .spark { flex: none; width: 46px; height: 22px; display: block; margin-left: 2px; }
  .up { color: var(--up-text); } .down { color: var(--down-text); } .flat { color: var(--flat); }
  .empty { padding: 22px 8px; text-align: center; color: var(--text-3); font-size: 13px; }
  .list-more { padding: 12px 8px 14px; text-align: center; color: var(--text-3); font-size: 12px; letter-spacing: 1px; user-select: none; }

  .list-tools { flex: none; display: flex; align-items: center; gap: 8px; padding: 2px 12px 4px; }
  .list-tools .mini-btn.is-on { border-color: #b9cbff; background: var(--brand-subtle); color: var(--brand-ink); }
  .list-tools .mini-btn:disabled { opacity: .5; cursor: default; color: var(--text-3); background: var(--surface-2); border-color: var(--border-subtle); }

  /* 板块 / 个股 / ETF / 指数池：撑满剩余高度并形成滚动容器 */
  #poolBoard, #poolStock, #poolETF, #poolIndex, #poolSearch { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #poolStock, #poolETF, #poolIndex, #poolSearch { display: none; }

  /* 搜索结果：板块 / 个股分区标题 */
  .search-sec { display: flex; align-items: center; gap: 6px; padding: 8px 10px 2px; font-size: 12px; color: var(--text-3); }
  .search-sec-name { font-weight: 600; color: var(--text-2); letter-spacing: 1px; }
  .search-sec-count { font-family: var(--font-num); font-size: 11px; color: var(--text-3); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; }

  /* —— 主显示区 —— */
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }

  .empty-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); font-size: 15px; min-height: 280px; }
  .empty-main svg { color: var(--text-3); opacity: .7; }
  .empty-main .sub { font-size: 13px; color: var(--text-3); }

  .rows { display: flex; flex-direction: column; gap: 12px; }
  .cols { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
  .col-head { flex: none; padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--border-subtle); }
  .col-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .col-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 13px; }

  /* —— 分时卡片 —— */
  .card { flex: none; height: 246px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); user-select: none; -webkit-user-select: none; }

  /* 网格平铺（A）：响应式多列，一屏看多张 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .grid .card { height: 216px; }

  /* 拖拽视觉反馈：可拖拽卡片给抓取光标，拖动中的卡片变幽灵并加投影，原位留占位卡 */
  .grid .card, .rows .card { cursor: grab; }
  .card.is-ghost { box-shadow: 0 18px 44px rgba(16,24,40,.24); outline: none; cursor: grabbing; }
  .card.drag-ph { background: rgba(91,140,255,.07) !important; border: 1px dashed #5b8cff !important; box-shadow: none !important; cursor: grabbing !important; }

  /* 一览（C）：全部标的以迷你缩略卡片平铺，点击放大 */
  .grid-o { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); text-align: left; transition: border-color .15s; user-select: none; -webkit-user-select: none; }
  .tile:hover { border-color: #b9cbff; }
  .tile-h { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tile-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--text-1); font-size: 13px; }
  .tile-code { font-family: var(--font-num); font-size: 11px; color: var(--text-3); }
  .tile-spark { display: block; width: 100%; height: 44px; }
  .tile-f { font-family: var(--font-num); font-size: 12px; font-weight: 600; }

  /* 一览「放大」焦点弹层 */
  .focus { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; }
  .focus.is-hide { display: none; }
  .focus-mask { position: absolute; inset: 0; background: rgba(22,28,40,.42); }
  .focus-card { position: relative; width: min(880px, 92vw); height: min(72vh, 580px); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 50px rgba(16,24,40,.25); display: flex; flex-direction: column; overflow: hidden; }
  .focus-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); font-size: 13px; }
  .focus-head .smic__name { font-size: 15px; font-weight: 700; }
  .focus-sp { flex: 1; }
  .focus-body { flex: 1; min-height: 0; padding: 8px; }
  #focusChart { width: 100%; height: 100%; }
  .smic { display: flex; flex-direction: column; gap: 4px; width: 100%; height: 100%; min-height: 0; }
  .smic__head { flex: none; display: flex; align-items: center; gap: 8px; font-size: 12px; min-height: 24px; }
  .smic__badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; }
  .smic__badge.is-board { background: var(--brand); }
  .smic__badge.is-stock { background: var(--stock); }
  .smic__badge.is-index { background: #7c5cd6; }
  .smic__badge.is-etf { background: var(--etf); }
  .smic__name { font-weight: 600; color: var(--text-1); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .smic__code { font-family: var(--font-num); color: var(--text-3); font-size: 11px; }
  .smic__sp { flex: 1; }
  .smic__price { font-family: var(--font-num); font-weight: 700; font-size: 16px; }
  .smic__pct { font-family: var(--font-num); font-weight: 600; font-size: 13px; }
  .smic__amt { font-family: var(--font-num); color: var(--text-3); font-size: 11px; }
  .smic__close { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 5px; color: var(--text-3); font-size: 15px; line-height: 1; }
  .smic__close:hover { background: var(--hover); color: var(--text-1); }
  .smic__canvas { position: relative; flex: 1; min-height: 0; width: 100%; }
  .smic__loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text-3); font-size: 12px; z-index: 1; }
  .smic__chart { position: absolute; inset: 0; }

  /* —— 轻提示 toast —— */
  .toast { position: fixed; right: 20px; bottom: 20px; z-index: 99; max-width: 360px; padding: 10px 16px; border-radius: 8px; font-size: 13px; color: var(--text-1); background: var(--surface); border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(16,24,40,.14); display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.is-show { opacity: 1; transform: translateY(0); }
  .toast.is-err .t-tag { color: var(--up-text); }
  .toast .t-tag { font-weight: 700; }

  @media (max-width: 1180px) { .panel { width: 320px; } }
  @media (max-width: 960px) { .panel { display: none; } .cols { flex-direction: column; } }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== 顶栏 ===================== -->
  <header>
    <div class="brand">
      <h1>多标的分时对比</h1>
      <span class="sub">SECTOR MINUTE · 板块 · 个股 · ETF · 指数</span>
    </div>

    <div class="sep"></div>

    <!-- 数据日期组件：显示当前分时对应的日期，支持前后切换与直接选日期 -->
    <div class="datebox" id="dateBox" title="当前展示数据对应的日期">
      <button type="button" class="datebox__btn" id="btnPrevDay" title="前一天" aria-label="前一天">‹</button>
      <button type="button" class="datebox__main" id="btnOpenDate" title="点击选择日期">
        <span class="datebox__l1" id="dateL1">----年--月--日</span>
        <span class="datebox__l2">
          <span id="dateWeek">---</span>
          <span class="datebox__tag is-live" id="dateTag">今天</span>
        </span>
      </button>
      <button type="button" class="datebox__btn" id="btnNextDay" title="后一天" aria-label="后一天" disabled>›</button>
      <button type="button" class="datebox__today" id="btnToday" title="回到今天（最新数据）" aria-label="回到今天">今</button>
      <input type="date" id="dateInput" class="datebox__input" aria-label="选择日期">
    </div>

    <div class="sep"></div>

    <span class="tool-caption">排布</span>
    <div class="seg" id="segLayout" title="多标的分时图排布方式">
      <button data-v="rows" class="is-on">纵向</button>
      <button data-v="grid">网格</button>
      <button data-v="overview">一览</button>
      <button data-v="columns">左右分栏</button>
    </div>

    <span class="tool-caption">纵轴</span>
    <div class="seg" id="segAxis" title="分时图纵轴刻度：涨跌幅(统一%)或绝对价">
      <button data-v="1" class="is-on">涨跌幅</button>
      <button data-v="0">绝对价</button>
    </div>

    <button type="button" class="chip" id="btnSort" title="选中后按当前涨跌幅从高到低重排图表">

<script>
"use strict";
/* ====================================================================
 * 板块分时 · 独立页前端
 * 数据源：FastAPI 后端 /api/sector-minute/*
 * 挂载前缀：独立运行时为 /api/sector-minute；由后端注入 window.SECTOR_MINUTE_API_BASE
 * 页面风格：浅色简洁专业风（本页固定浅色）
 * ==================================================================== */
const API_BASE = window.SECTOR_MINUTE_API_BASE || "/api/sector-minute";
const API = {
  health:  API_BASE + "/health",
  refresh: API_BASE + "/refresh",
  boards:  (t) => API_BASE + "/boards?board_type=" + t,
  stocks:  (kw) => API_BASE + "/stocks?kw=" + encodeURIComponent(kw),
  etfs:    (kw) => API_BASE + "/etfs?kw=" + encodeURIComponent(kw),
  indices: API_BASE + "/indices",
  subs:    API_BASE + "/subscriptions",
  charts:  (date) => API_BASE + "/charts" + (date ? "?date=" + date : ""),
  sparklines: (date) => API_BASE + "/sparklines" + (date ? "?date=" + date : ""),
};
const STORE_KEY = "sectorMinute_selected";
const UI_STORE_KEY = "sectorMinute_ui";
const BOARD_TYPES = [["hy","行业"],["hy2","二级"],["gn","概念"],["fg","风格"],["dq","地区"]];

/* ---------------- 日期工具（日期切换组件） ---------------- */
const WEEK_CN = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseDateStr = (s) => { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); };
// 「今天」基准：优先服务器自然日（后端新版本提供 server_date）；缺失时以浏览器本地日期兜底，
// 保证组件在任意后端版本下均可正常使用
const todayStr = () => state.serverDate || toDateStr(new Date());
// 当前是否展示「今天（实时）」：date 为空串即今天；历史日期则非实时
const isTodaySel = () => !state.date || state.date === todayStr();
// 历史分时可回溯下限（约一年），超出时后端返回空数据
const minDateStr = () => {
  const base = parseDateStr(todayStr());
  base.setDate(base.getDate() - 365);
  return toDateStr(base);
};

/* ---------------- 状态 ---------------- */
const state = {
  layout: "rows",        // rows | columns
  normalized: true,      // Y 轴涨跌幅 / 绝对价
  sortByPct: false,
  refreshInterval: 30,
  activeTab: "board",
  boardType: "hy",
  stockMarket: "",
  stockKw: "",
  boardKw: "",
  boards: [],
  allBoards: [],
  stocks: [],
  etfs: [],
  etfLoading: false,         // ETF 池加载状态（首次进入/搜索时懒加载）
  indices: [],
  indicesState: "loading",   // loading | error | ok（指数池加载状态，失败可点击重试）
  selected: [],
  chartsData: [],
  sparkCache: {},        // key -> {pre_close, change_pct, points}  迷你分时简图缓存（命中不再触网）
  trading: false,
  lastUpdate: "",
  // 数据日期（日期切换组件）："" = 今天（实时）；"YYYY-MM-DD" = 历史交易日
  date: "",
  serverDate: "",
  histDone: false,       // 历史日期后台抓取是否已抓全
  histHasData: false,    // 历史日期是否至少有一标的有分时点（非交易日为 false）
  histNoDataShown: false,// 已提示过「该日期无数据」，避免轮询期间重复 toast
};
let charts = {};          // ECharts 实例 key 索引
let hoverSelf = new Set(); // 联动回环保护
let dragActive = false;    // 拖拽进行中标志：抑制轮询重建，避免把拖到的顺序弹回原位
let pollTimer = null, catchUpTimer = null, searchTimer = null, stockSeq = 0;
let sparkQueue = [], sparkQueued = new Set(), sparkBusy = 0;  // 迷你分时简图懒加载
let sparkRetries = {};  // key -> 已重试次数（后端瞬时抓取失败/超出单批上限时退避重试）
// 每批请求数须 ≤ 后端 MAX_LAZY_SPARKS（config.py 默认 12）：
// 后端单次请求只对前 12 个未命中 key 补抓，超出部分只会进 missing 返回，
// 批量一旦超过就会有无重试路径的 key 永远空图。
const SPARK_BATCH = 12;
const SPARK_MAX_RETRIES = 3;

// 长列表无限滚动分批渲染：板块/个股/ETF/指数/搜索结果全量数据只渲染「已显示」部分，
// 滚动接近底部时按批追加，避免一次性构建上万 DOM 节点拖慢首屏。
const LIST_BATCH = 120;
const LIST_LIMITS = { board: 0, stock: 0, etf: 0, index: 0, search: 0 };
const LIST_EL_IDS = { board: "listBoard", stock: "listStock", etf: "listETF", index: "listIndex", search: "listSearch" };
const LIST_RENDERERS = { board: renderBoardList, stock: renderStockList, etf: renderEtfList, index: renderIndexList, search: renderSearchList };
function resetListLimits(...kinds) { kinds.forEach((k) => { LIST_LIMITS[k] = 0; }); }
let mainSeq = 0;           // 图表 DOM id 全局自增（增量增删时保证 id 唯一）

/* ---------------- 工具 ---------------- */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
const numCls = (v) => v > 1e-6 ? "up" : v < -1e-6 ? "down" : "flat";
const fmtPct = (v) => v === null || v === undefined || !Number.isFinite(v) ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const fmtNum = (v, d = 2) => v === null || v === undefined || !Number.isFinite(v) ? "—" : v.toFixed(d);
const fmtVol = (v) => {
  if (!v && v !== 0) return "—";
  if (v >= 1e8) return (v / 1e8).toFixed(2) + "亿";
  if (v >= 1e4) return (v / 1e4).toFixed(1) + "万";
  return String(v);
};
const keyOf = (s) =>
  s.kind === "board"
    ? "board:" + (s.board_type || "hy") + ":" + s.market + ":" + s.code
    : s.kind + ":" + s.market + ":" + s.code;

// 带自动重试的 fetch+json：吸收本机网络层对本地连接的偶发重置（安全软件/代理可能随机 RST），
// 失败按 0.5s/1s/2s 指数退避重试，重试耗尽后抛出最后一次错误。
// 仅网络层错误（fetch 抛 TypeError，或消息含 network/socket/reset）值得重试；
// HTTP 状态错误（如 404）是服务端确定响应，不重试。
async function fetchJson(url, opts, retries = 3) {
  const isRetryable = (e) => e instanceof TypeError || /network|fetch|socket|reset/i.test(e.message || "");
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(url, opts);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      if (!isRetryable(e) || i >= retries) throw e;
      await new Promise((res) => setTimeout(res, 500 * Math.pow(2, i)));
    }
  }
}

let toastTimer = null;
function toast(msg, isErr) {
  const el = $("#toast");
  el.querySelector(".t-tag").textContent = isErr ? "提示" : "完成";
  el.querySelector(".t-msg").textContent = msg;
  el.className = "toast is-show" + (isErr ? " is-err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
}

/* ---------------- 数据加载 ---------------- */
// 板块类型 → 中文名（用于跨组搜索时的类型徽标）
const BT_NAME = Object.fromEntries(BOARD_TYPES);

async function loadAllBoards() {
  // 并行拉取全部板块类型，合并进 allBoards，供跨组同时搜索
  try {
    const results = await Promise.all(
      BOARD_TYPES.map(async ([k]) => {
        const d = await fetchJson(API.boards(k));
        return (d.items || []).map((b) => ({ ...b, board_type: b.board_type || k }));
      })
    );
    state.allBoards = results.flat() || [];
  } catch (e) { /* 静默：单个类型失败不影响，搜索时依赖已加载缓存 */ }
}

async function loadBoards() {
  try {
    const data = await fetchJson(API.boards(state.boardType));
    state.boards = data.items || [];
    resetListLimits("board");
    renderBoardList();
  } catch (e) { toast((e.message || String(e)), true); }
}

async function loadStocks() {
  const seq = ++stockSeq;
  try {
    // 始终拉取全量个股池，市场/关键词过滤在本地 visibleStocks() 进行，
    // 避免搜索词污染池数据导致「显示不全 / 切换市场无效」。
    const data = await fetchJson(API.stocks(""));
    if (seq !== stockSeq) return;
    // 按 深市(0)→沪市(1)→京市(2)、代码升序排列，避免「全部」以北交所打头，更贴近日常浏览习惯
    const arr = (data.items || []).slice();
    arr.sort((a, b) => (a.market - b.market) || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0));
    state.stocks = arr;
    resetListLimits("stock");
    renderStockList();
    renderSearchList(); // 搜索面板（若有词）同步刷新个股结果
  } catch (e) { if (seq === stockSeq) toast((e.message || String(e)), true); }
}

async function loadEtfs() {
  // 首次进入/搜索时按需拉取全量池（约 1700 只）；关键词过滤由前端完成，与板块/个股一致
  state.etfLoading = true;
  resetListLimits("etf");
  try {
    const data = await fetchJson(API.etfs(""));
    state.etfs = data.items || [];
  } catch (e) { toast((e.message || String(e)), true); }
  state.etfLoading = false;
  renderEtfList();
}

async function loadIndices() {
  state.indicesState = state.indices.length ? "ok" : "loading";
  resetListLimits("index");
  try {
    const data = await fetchJson(API.indices);
    state.indices = data.items || [];
    state.indicesState = "ok";
  } catch (e) {
    state.indicesState = "error"; // 重试耗尽仍失败 → 列表显示错误态，可点击重试
    toast("指数加载失败，请重试", true);
  }
  renderIndexList();
}

async function loadHealth() {
  try {
    const h = await fetchJson(API.health);
    state.trading = !!h.trading;
    state.serverDate = h.server_date || "";
  } catch (e) {
    state.serverDate = ""; // health 失败时以浏览器本地日期兜底，组件仍可用
  }
  restoreDateFromStore();
  renderDateBox();
  syncStatus();
}

async function loadCharts() {
  // 拖拽进行中：跳过本轮，避免 buildMain 用旧顺序重建 DOM 把卡片弹回原位
  if (dragActive) return;
  try {
    const data = await fetchJson(API.charts(state.date || ""));
    // 历史日期状态：抓取完成标记 / 是否有分时数据（用于提前结束轮询与空数据提示）
    if (data.is_hist) {
      state.histDone = !!data.done;
      state.histHasData = !!data.has_data;
      if (state.histDone && !state.histHasData && state.selected.length && !state.histNoDataShown) {
        state.histNoDataShown = true;
        toast("该日期无分时数据（可能为非交易日）", true);
      }
    } else {
      state.histDone = false; state.histHasData = false; state.histNoDataShown = false;
    }
    const items = data.items || [];
    const byKey = new Map(items.map((c) => [keyOf(c), c]));
    let list = state.selected.map((s) => byKey.get(keyOf(s)) || {
      kind: s.kind, market: s.market, code: s.code, name: s.name, board_type: s.board_type || "",
      pre_close: 0, open: null, high: null, low: null, close: null, change_pct: null, change_amt: null, points: [], ts: "",
    });
    if (state.sortByPct) list = [...list].sort((a, b) => (b.change_pct ?? -Infinity) - (a.change_pct ?? -Infinity));
    state.chartsData = list;
    if (data.ts) state.lastUpdate = new Date(data.ts * 1000).toLocaleTimeString("zh-CN", { hour12: false });
    // 若当前已初始化的图表数与选中数不一致（新增/移除尚未反映到 DOM），
    // 需重建卡片，否则新勾选项永远不会渲染出来
    if (Object.keys(charts).length !== state.selected.length) {
      buildMain();
    } else {
      updateCharts();
    }
    syncStatus();
    return data;
  } catch (e) { toast((e.message || String(e)), true); }
}

async function syncSubscriptions() {
  if (!state.selected.length) { fetchJson(API.subs, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items: [] }) }, 1).catch(() => {}); return; }
  try {
    await fetchJson(API.subs, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: state.selected.map((s) => ({ kind: s.kind, market: s.market, code: s.code, name: s.name, board_type: s.board_type })) }),
    });
    startCatchUp();
  } catch (e) { toast((e.message || String(e)), true); }
}

/* 数据补齐：勾选/刷新/切换日期后每 1.5s 拉一次，直到全部到位 */
function startCatchUp() {
  clearTimeout(catchUpTimer);
  let tries = 0;
  const tick = async () => {
    await loadCharts();
    // 历史日期且服务器已抓全但无分时点（非交易日）：无需再轮询
    if (state.date && state.histDone && !state.histHasData) { catchUpTimer = null; return; }
    const withData = new Set(state.chartsData.filter((c) => c.points && c.points.length).map((c) => keyOf(c)));
    const allReady = state.selected.every((s) => withData.has(keyOf(s)));
    if (allReady || ++tries >= 20) { catchUpTimer = null; return; }
    catchUpTimer = setTimeout(tick, 1500);
  };
  tick();
}

async function manualRefresh() {
  const btn = $("#btnRefresh");
  btn.disabled = true; btn.classList.add("is-spinning");
  // POST 返回仅表示已唤醒后台线程；真正的抓取在其后串行进行。
  // 记录刷新前时间戳，随后等待后台 mark_refreshed（last_refresh_ts 变化）作为本轮完成的信号。
  let before = -1;
  try {
    await fetchJson(API.refresh, { method: "POST" }, 2);
    const h0 = await fetchJson(API.health);
    before = (h0 && h0.last_refresh_ts) || -1;
  } catch (e) { /* POST 失败也继续收尾 */ }

  // 等待后台完成本轮（至多约 20s，超时兜底不阻塞）
  const deadline = Date.now() + 20000;
  while (Date.now() < deadline) {
    let ts = -1;
    try {
      const h = await fetchJson(API.health);
      ts = (h && h.last_refresh_ts) || -1;
    } catch (e) { /* 忽略瞬时错误 */ }
    if (ts > before) break;
    await new Promise((r) => setTimeout(r, 350));
  }

  await Promise.all([loadCharts(), loadHealth()]);
  btn.disabled = false; btn.classList.remove("is-spinning");
  startCatchUp();
  toast("已刷新，行情已更新");
}

/* ---------------- 选择逻辑 ---------------- */
// 用最新 selected 立即对齐 chartsData（查旧数据表，缺失项生成占位）。
// 否则 buildMain 会拿着上一次的陈旧 chartsData 渲染，导致取消后改选仍显示旧标的。
function applySelection() {
  const byKey = new Map(state.chartsData.map((c) => [keyOf(c), c]));
  state.chartsData = state.selected.map((s) => byKey.get(keyOf(s)) || {
    kind: s.kind, market: s.market, code: s.code, name: s.name, board_type: s.board_type || "",
    pre_close: 0, open: null, high: null, low: null, close: null, change_pct: null, change_amt: null, points: [], ts: "",
  });
  if (state.sortByPct) state.chartsData = [...state.chartsData].sort((a, b) => (b.change_pct ?? -Infinity) - (a.change_pct ?? -Infinity));
}

function toggleTarget(t) {
  const k = keyOf(t);
  const exists = state.selected.some((s) => keyOf(s) === k);
  if (exists) {
    state.selected = state.selected.filter((s) => keyOf(s) !== k);
  } else {
    state.selected.push({ kind: t.kind, market: t.market, code: t.code, name: t.name, board_type: t.board_type || "" });
  }
  persist();
  applySelection();
  syncSubscriptions();
  renderBoardList(); renderStockList(); renderIndexList(); renderSearchList(); renderSelect();
  if (canIncremental()) {
    // 增量：新增单张图表 / 移除单张图表，避免全量重建造成卡顿
    if (exists) removeChartByKey(k);
    else {
      const byKey = new Map(state.chartsData.map((x) => [keyOf(x), x]));
      insertChart(byKey.get(k));
    }
  } else {
    buildMain();
  }
}

function removeTarget(k) {
  state.selected = state.selected.filter((s) => keyOf(s) !== k);
  persist();
  applySelection();
  if (state.selected.length) syncSubscriptions(); else state.chartsData = [];
  renderBoardList(); renderStockList(); renderIndexList(); renderSelect();
  if (canIncremental()) removeChartByKey(k);
  else buildMain();
}

// 一键清空所有已选对比标的与分时图
function clearAll() {
  state.selected = [];
  persist();
  state.chartsData = [];
  syncSubscriptions(); // 后端订阅置空，停止抓取
  renderBoardList(); renderStockList(); renderIndexList(); renderSearchList(); renderSelect(); buildMain();
  toast("已清空对比列表");
}

function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state.selected)); } catch (e) {} }
// 持久化排布/纵轴/排序/刷新间隔/数据日期等 UI 状态，刷新后原样恢复
function persistUI() {
  try {
    localStorage.setItem(UI_STORE_KEY, JSON.stringify({
      layout: state.layout, normalized: state.normalized,
      sortByPct: state.sortByPct, refreshInterval: state.refreshInterval,
      date: state.date,
    }));
  } catch (e) {}
}

// 全选 / 取消全选：作用于当前可见（受搜索/筛选影响）的列表
function toggleSelectAll(kind) {
  const items = kind === "board"
    ? visibleBoards().map((b) => ({ kind: "board", market: 1, code: b.code, name: b.name, board_type: b.board_type }))
    : kind === "index"
      ? (state.indices || []).map((i) => ({ kind: "index", market: i.market, code: i.code, name: i.name }))
      : visibleStocks().map((s) => ({ kind: "stock", market: s.market, code: s.code, name: s.name }));
  if (!items.length) return;
  const anySel = items.some((it) => state.selected.some((s) => keyOf(s) === keyOf(it)));
  if (anySel) {
    // 当前可见项中已有选中 → 取消选中这些项
    const rm = new Set(items.map(keyOf));
    state.selected = state.selected.filter((s) => !rm.has(keyOf(s)));
  } else {
    // 当前可见项均未选中 → 全选当前可见列表的全部项
    const cur = new Set(state.selected.map(keyOf));
    const add = items.filter((it) => !cur.has(keyOf(it)));
    state.selected = state.selected.concat(add);
  }
  persist();
  syncSubscriptions();
  renderBoardList(); renderStockList(); renderIndexList(); renderSelect(); buildMain();
}

function renderSelect() {
  $("#selCount").textContent = state.selected.length;
  const clearBtn = $("#btnClearAll");
  clearBtn.disabled = !state.selected.length;
}

function syncStatus() {
  const live = state.trading;
  const hist = !isTodaySel();
  $("#dot").className = "dot" + (live && !hist ? " is-live" : "");
  const tg = $("#tradingLabel");
  if (hist) {
    // 历史日期：非实时数据，状态区展示数据日期
    tg.textContent = "历史数据";
    tg.className = "tag";
    $("#lastTimeLabel").textContent = "数据日期";
    $("#lastTime").textContent = state.date || "--";
    // 历史日期为静态快照，手动刷新无意义 → 禁用
    const refreshBtn = $("#btnRefresh");
    refreshBtn.disabled = true;
    refreshBtn.title = "历史日期为静态数据，无需刷新";
  } else {
    tg.textContent = live ? "交易时段" : "非交易时段";
    tg.className = "tag" + (live ? " is-live" : "");
    $("#lastTimeLabel").textContent = "最后更新";
    $("#lastTime").textContent = state.lastUpdate || "--:--:--";
    const refreshBtn = $("#btnRefresh");
    refreshBtn.disabled = false;
    refreshBtn.title = "立即拉取一次最新行情";
  }
}

/* ---------------- 数据日期组件（显示 + 前后切换 + 日期选择） ---------------- */
// 渲染日期显示：年/月/日 + 星期 + 实时/历史徽标，并同步前后按钮可用态
function renderDateBox() {
  const d = state.date ? parseDateStr(state.date) : parseDateStr(todayStr());
  $("#dateL1").textContent = `${d.getFullYear()}年${String(d.getMonth() + 1).padStart(2, "0")}月${String(d.getDate()).padStart(2, "0")}日`;
  $("#dateWeek").textContent = WEEK_CN[d.getDay()];
  const hist = !isTodaySel();
  $("#dateBox").classList.toggle("is-hist", hist);
  const tag = $("#dateTag");
  if (hist) { tag.textContent = "历史"; tag.className = "datebox__tag is-hist"; }
  else { tag.textContent = "今天"; tag.className = "datebox__tag is-live"; }
  // 后一天：已处于今天/最新日期则禁用；今天之前均可向后切回
  $("#btnNextDay").disabled = !state.date || state.date >= todayStr();
  $("#btnToday").disabled = !hist;
  const inp = $("#dateInput");
  inp.min = minDateStr();
  inp.max = todayStr();
  inp.value = state.date || todayStr();
}

// 切换数据日期："" = 今天（实时）；否则为历史交易日。切换后按新日期拉取分时。
function selectDate(dStr) {
  if ((state.date || "") === (dStr || "")) return;
  state.date = dStr || "";
  state.histNoDataShown = false;
  // 日期变化 → 历史/实时数据都不同，清空简图缓存与当前图表数据，避免显示旧日期残留
  state.sparkCache = {};
  sparkRetries = {};
  resetChartsForDate();
  persistUI();
  renderDateBox();
  syncStatus();
  loadCharts();
  if (state.selected.length) startCatchUp(); // 历史日期：轮询直至后台抓全；今天：补齐首帧
}

// 清空当前图表分时点（保留标的元数据），让卡片显示「加载中…」直至新日期数据到位
function resetChartsForDate() {
  state.chartsData = state.chartsData.map((c) => ({
    kind: c.kind, market: c.market, code: c.code, name: c.name, board_type: c.board_type || "",
    pre_close: 0, open: null, high: null, low: null, close: null,
    change_pct: null, change_amt: null, points: [], ts: "",
  }));
  if (Object.keys(charts).length) updateCharts();
}

// 从本地存储恢复上次选择的数据日期（需在今天基准就绪后调用，校验不越界）
function restoreDateFromStore() {
  try {
    const ui = JSON.parse(localStorage.getItem(UI_STORE_KEY) || "{}");
    const saved = (ui && typeof ui.date === "string") ? ui.date : "";
    const t = todayStr();
    if (saved && t) {
      if (saved >= t) { state.date = ""; }      // 今天或未来 → 实时
      else if (saved < minDateStr()) { state.date = ""; }  // 超出回溯下限 → 实时
      else { state.date = saved; }
    } else {
      state.date = "";
    }
  } catch (e) { state.date = ""; }
  renderDateBox();
  syncStatus();
}

/* ---------------- 迷你分时简图（列表项内） ---------------- */
// 命中 store 缓存立即绘制；未命中且进入视口的标的懒加载入队，批量按需抓取。
// 通过 IntersectionObserver 判断可见性，避免为数千个个股逐一拉取造成性能/风控问题。
const SPARK = { w: 46, h: 22, pad: 1.5 };

function drawSpark(el, d) {
  const pts = d && d.points && d.points.length ? d.points : null;
  el.innerHTML = "";
  if (!pts || !pts.length) return;
  const pre = d.pre_close || 0;
  // 统一按「涨跌幅」归一（与主图默认一致）；无昨收退回 min-max
  let vals = pts.map((p) => (pre > 0 ? ((p.price - pre) / pre) * 100 : p.price));
  let lo, hi;
  if (pre > 0) { const m = Math.max(Math.max(...vals.map(Math.abs)), 0.5); lo = -m; hi = m; }
  else { lo = Math.min(...vals); hi = Math.max(...vals); if (hi - lo < 1e-9) { hi = lo + 1; lo -= 1; } }
  const x = (i) => SPARK.pad + (i / Math.max(vals.length - 1, 1)) * (SPARK.w - 2 * SPARK.pad);
  const y = (v) => SPARK.pad + (1 - (v - lo) / (hi - lo)) * (SPARK.h - 2 * SPARK.pad);
  const line = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(2) + " " + y(v).toFixed(2)).join(" ");
  const up = (d.change_pct || 0) > 0;
  const color = up ? "#e5484d" : "#18a058";
  // 昨收虚线（涨跌幅模式位于中轴）
  let s = "";
  if (pre > 0) {
    const preY = y(0);
    s += `<line x1="${SPARK.pad}" y1="${preY}" x2="${SPARK.w - SPARK.pad}" y2="${preY}" stroke="#c3ccd8" stroke-width="1" stroke-dasharray="2 2"/>`;
  }
  s += `<path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  el.innerHTML = s;
}

let sparkObserver = null;
function ensureSparkObserver() {
  if (sparkObserver || !("IntersectionObserver" in window)) return;
  sparkObserver = new IntersectionObserver((entries) => {
    let any = false;
    entries.forEach((en) => {
      if (!en.isIntersecting) return;
      sparkObserver.unobserve(en.target);
      const k = en.target.dataset.key;
      if (!k) return;
      if (state.sparkCache[k]) drawSpark(en.target, state.sparkCache[k]);
      else { enqueueSpark(k); any = true; }
    });
    if (any) scheduleFlush();
  }, { rootMargin: "60px 0px" });
}
function observeSparks(rootEl) {
  if (!rootEl) return;
  ensureSparkObserver();
  rootEl.querySelectorAll(".spark[data-key]").forEach((el) => {
    const k = el.dataset.key;
    if (state.sparkCache[k]) { drawSpark(el, state.sparkCache[k]); return; }
    if (el._obs) return;
    el._obs = true;
    if (sparkObserver) sparkObserver.observe(el);
  });
}

// 长列表无限滚动：滚动接近底部且还有未渲染项时，按批追加渲染
function bindListInfiniteScroll() {
  Object.entries(LIST_EL_IDS).forEach(([kind, id]) => {
    const el = document.getElementById(id);
    if (!el || el.__scrollBound) return;
    el.__scrollBound = true;
    el.addEventListener("scroll", () => {
      if (el.scrollTop + el.clientHeight >= el.scrollHeight - 80) {
        const total = Number(el.dataset.total) || 0;
        if (LIST_LIMITS[kind] < total) {
          LIST_LIMITS[kind] += LIST_BATCH;
          const fn = LIST_RENDERERS[kind];
          if (fn) fn();
        }
      }
    });
  });
}
function enqueueSpark(k) {
  if (state.sparkCache[k] || sparkQueued.has(k)) return;
  sparkQueued.add(k);
  sparkQueue.push(k);
}
let sparkTimer = null;
function scheduleFlush() {
  clearTimeout(sparkTimer);
  sparkTimer = setTimeout(flushSparks, 180);
}
function flushSparks() {
  if (sparkBusy || !sparkQueue.length) return;
  sparkBusy = 1;
  const batch = sparkQueue.splice(0, SPARK_BATCH);
  // 历史日期：迷你分时简图同样按所选日期取数（后端按日期缓存/抓取）
  // 注意：API.sparklines(date) 在 date 非空时已带 ?date=…，追加参数需用 & 而非 ?
  const dateStr = state.date || "";
  const sep = dateStr ? "&" : "?";
  fetchJson(API.sparklines(dateStr) + sep + "codes=" + encodeURIComponent(batch.join(",")) + "&lazy=1", null, 2)
    .then((res) => {
      const items = (res && res.items) || {};
      Object.entries(items).forEach(([k, d]) => { delete sparkRetries[k]; state.sparkCache[k] = d; });
      if (Object.keys(items).length) {
        // 回填当前渲染的所有匹配项（含隐藏分区，切页即已就绪）
        document.querySelectorAll(".spark[data-key]").forEach((svg) => {
          const d = state.sparkCache[svg.dataset.key];
          if (d) drawSpark(svg, d);
        });
      }
      // 未取到的 key（后端瞬时抓取失败等）：有限次退避重试，避免永久空图
      retrySparks(((res && res.missing) || []).filter((k) => !items[k]));
    })
    .catch(() => { retrySparks(batch); /* 瞬时失败：退避后整批重试 */ })
    .finally(() => {
      sparkBusy = 0;
      batch.forEach((k) => sparkQueued.delete(k));
      if (sparkQueue.length) setTimeout(flushSparks, 150);
    });
}

// 对本轮未取到数据的 key 做有限次退避重试（1.5s 起步逐次加倍）。
// IntersectionObserver 是一次性观察且列表不随轮询重建，漏掉的 key 若不在此处
// 重新入队就再无补图机会；超过重试上限的视为真无数据（停牌等）放弃。
function retrySparks(keys) {
  const due = [];
  keys.forEach((k) => {
    if (state.sparkCache[k]) return;
    const n = (sparkRetries[k] || 0) + 1;
    sparkRetries[k] = n;
    if (n <= SPARK_MAX_RETRIES) due.push(k);
  });
  if (!due.length) return;
  const maxN = Math.max(...due.map((k) => sparkRetries[k]));
  setTimeout(() => {
    due.forEach((k) => { if (!state.sparkCache[k]) enqueueSpark(k); });
    scheduleFlush();
  }, 1500 * Math.pow(2, maxN - 1));
}

/* ---------------- 主体渲染 ---------------- */
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

// 类型徽标：板块/个股/指数/ETF 各自的样式与文字
function kindBadge(kind) {
  if (kind === "stock") return { cls: "is-stock", label: "股" };
  if (kind === "index") return { cls: "is-index", label: "指" };
  if (kind === "etf") return { cls: "is-etf", label: "基" };
  return { cls: "is-board", label: "板" };
}

// 单张图表卡片 HTML（idx 为图表 DOM id 后缀，各行内不同布局共用）
function makeCard(c, idx) {
  const bd = kindBadge(c.kind);
  return `<div class="card" data-key="${keyOf(c)}"><div class="smic">
    <div class="smic__head">
      <span class="smic__badge ${bd.cls}">${bd.label}</span>
      <span class="smic__name" title="${esc(c.code)}">${esc(c.name || c.code)}</span>
      <span class="smic__code">${esc(c.code)}</span><span class="smic__sp"></span>
      <span class="smic__price ${numCls(c.change_pct)}">${fmtNum(c.close)}</span>
      <span class="smic__pct ${numCls(c.change_pct)}">${fmtPct(c.change_pct)}</span>
      <span class="smic__amt ${numCls(c.change_amt)}">${c.change_amt > 0 ? "+" : ""}${fmtNum(c.change_amt)}</span>
      <button type="button" class="smic__close" data-remove="${keyOf(c)}" title="从对比列表移除">×</button>
    </div>
    <div class="smic__canvas">
      <div class="smic__loading" style="display:${c.points && c.points.length ? "none" : "flex"}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span>加载中…</span>
      </div>
      <div class="smic__chart" id="chart-${idx}"></div>
    </div>
  </div></div>`;
}

// 一览（C）缩略卡片：标题 + 迷你分时线 + 涨跌幅
function makeTile(c) {
  const bd = kindBadge(c.kind);
  return `<button type="button" class="tile" data-key="${keyOf(c)}">
    <span class="tile-h">
      <span class="smic__badge ${bd.cls}">${bd.label}</span>
      <span class="tile-name">${esc(c.name || c.code)}</span>
      <span class="tile-code">${esc(c.code)}</span>
    </span>
    <svg class="tile-spark" viewBox="0 0 140 44" preserveAspectRatio="none"></svg>
    <span class="tile-f ${numCls(c.change_pct)}">${c.change_pct > 1e-6 ? "+" : ""}${fmtPct(c.change_pct)}　${fmtNum(c.close)}</span>
  </button>`;
}

// 用分时真实点绘制一览缩略线（自身数据，不再额外触网）
function drawTileSpark(svg, c) {
  const pts = c && c.points && c.points.length ? c.points : null;
  svg.innerHTML = "";
  if (!pts) return;
  const pre = c.pre_close || 0;
  let vals = pts.map((p) => (pre > 0 ? ((p.price - pre) / pre) * 100 : p.price));
  let lo, hi;
  if (pre > 0) { const m = Math.max(Math.max(...vals.map(Math.abs)), 0.5); lo = -m; hi = m; }
  else { lo = Math.min(...vals); hi = Math.max(...vals); if (hi - lo < 1e-9) { hi = lo + 1; lo -= 1; } }
  const W = 140, H = 44, pad = 2;
  const x = (i) => pad + (i / Math.max(vals.length - 1, 1)) * (W - 2 * pad);
  const y = (v) => pad + (1 - (v - lo) / (hi - lo)) * (H - 2 * pad);
  const line = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(2) + " " + y(v).toFixed(2)).join(" ");
  const color = (c.change_pct || 0) > 0 ? "#e5484d" : "#18a058";
  let s = "";
  if (pre > 0) s += `<line x1="${pad}" y1="${y(0)}" x2="${W - pad}" y2="${y(0)}" stroke="#c3ccd8" stroke-width="1" stroke-dasharray="2 2"/>`;
  s += `<path d="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  svg.innerHTML = s;
}

function buildMain() {
  // 清空旧实例与 DOM
  Object.keys(charts).forEach((k) => { charts[k].dispose(); });
  charts = {};
  const area = $("#mainArea");
  area.innerHTML = "";
  $("#emptyState").style.display = state.selected.length ? "none" : "flex";

  if (!state.selected.length) return;

  // 一览（C）：全部标的以缩略卡平铺，点击放大
  if (state.layout === "overview") {
    const byKey = new Map(state.chartsData.map((c) => [keyOf(c), c]));
    area.innerHTML = `<div class="grid-o">${state.chartsData.map((c) => makeTile(c)).join("")}</div>`;
    area.querySelectorAll(".tile").forEach((t) => drawTileSpark(t.querySelector(".tile-spark"), byKey.get(t.dataset.key)));
    return;
  }

  let html = "";
  if (state.layout === "columns") {
    const boards = state.chartsData.filter((c) => c.kind === "board");
    const stocks = state.chartsData.filter((c) => c.kind === "stock");
    const etfs = state.chartsData.filter((c) => c.kind === "etf");
    html += `<div class="cols">
      <div class="col"><div class="col-head">板块</div><div class="col-list">${
        boards.length ? boards.map((c, i) => makeCard(c, i)).join("") : '<div class="col-empty">未选择板块</div>'
      }</div></div>
      <div class="col"><div class="col-head">个股</div><div class="col-list">${
        stocks.length ? stocks.map((c, i) => makeCard(c, boards.length + i)).join("") : '<div class="col-empty">未选择个股</div>'
      }</div></div>
      <div class="col"><div class="col-head">ETF</div><div class="col-list">${
        etfs.length ? etfs.map((c, i) => makeCard(c, boards.length + stocks.length + i)).join("") : '<div class="col-empty">未选择 ETF</div>'
      }</div></div>
    </div>`;
  } else if (state.layout === "grid") {
    html = `<div class="grid">${state.chartsData.map((c, i) => makeCard(c, i)).join("")}</div>`;
  } else {
    html = `<div class="rows">${state.chartsData.map((c, i) => makeCard(c, i)).join("")}</div>`;
  }
  area.innerHTML = html;

  // 初始化图表实例
  area.querySelectorAll(".smic__chart").forEach((el) => {
    charts[el.id] = initChartEl(el);
  });
  updateCharts();
}

// 初始化单个 ECharts 实例并绑定悬停联动（供 buildMain 全量 / insertChart 增量复用）
function initChartEl(el) {
  const ins = echarts.init(el, null, { renderer: "canvas" });
  ins.on("updateAxisPointer", (evt) => {
    if (hoverSelf.has(ins)) return;
    const di = evt.axesInfo && evt.axesInfo[0] && typeof evt.axesInfo[0].value === "number" ? evt.axesInfo[0].value : -1;
    if (di < 0) return;
    Object.entries(charts).forEach(([ok, oins]) => {
      if (oins === ins) return;
      hoverSelf.add(oins);
      oins.dispatchAction({ type: "showTip", seriesIndex: 0, dataIndex: di });
      setTimeout(() => hoverSelf.delete(oins), 60);
    });
  });
  return ins;
}

// 是否可采用「增量增删单张图表」策略：
// 仅纵向布局且未开启涨幅排序时可行（其余需重排，回退全量 buildMain）
function canIncremental() {
  return state.layout === "rows" && !state.sortByPct;
}

// 增量：仅在末尾追加一张新标的图表（其余图表不重建）
function insertChart(c) {
  const area = $("#mainArea");
  $("#emptyState").style.display = "none";
  let rows = area.querySelector(".rows");
  if (!rows) { rows = document.createElement("div"); rows.className = "rows"; area.appendChild(rows); }
  const seq = mainSeq++;
  rows.insertAdjacentHTML("beforeend", makeCard(c, seq));
  const chartEl = rows.lastElementChild.querySelector(".smic__chart");
  charts[chartEl.id] = initChartEl(chartEl);
  const byKey = new Map(state.chartsData.map((x) => [keyOf(x), x]));
  const cd = byKey.get(keyOf(c)) || c;
  charts[chartEl.id].setOption(buildChartOption(cd), true);
  const loading = chartEl.parentElement.querySelector(".smic__loading");
  if (loading) loading.style.display = (cd.points && cd.points.length) ? "none" : "flex";
}

// 增量：移除指定标所的图表（其余图表不重建）
function removeChartByKey(k) {
  const area = $("#mainArea");
  const card = area.querySelector(`.card[data-key="${k}"]`);
  if (card) {
    const chartEl = card.querySelector(".smic__chart");
    if (chartEl && charts[chartEl.id]) { charts[chartEl.id].dispose(); delete charts[chartEl.id]; }
    card.remove();
  }
  if (!state.selected.length) {
    $("#emptyState").style.display = "flex";
    area.innerHTML = "";
  } else {
    const rows = area.querySelector(".rows");
    /* rows 已无任何卡片则清掉空容器，避免残留空布局 */
    if (rows && !rows.querySelector(".card")) area.innerHTML = "";
  }
}

function buildChartOption(c) {
  const points = c.points || [];
  const pre_close = c.pre_close || 0;
  const up = (c.change_pct || 0) > 0;
  const times = points.map((p) => String(p.time).slice(0, 5));
  const prices = points.map((p) => p.price);
  const avgs = points.map((p) => p.avg || null);
  const vols = points.map((p) => p.vol || 0);
  const pcts = prices.map((p) => (pre_close > 0 ? ((p - pre_close) / pre_close) * 100 : 0));

  const upColor = up ? "#e5484d" : "#18a058";
  const lineColor = up ? "#e5484d" : "#18a058";

  // 午间休市标记
  const ls = times.findIndex((t) => t >= "11:30");
  const le = times.findIndex((t) => t >= "13:00");
  const lunchArea = ls >= 0 && le > ls
    ? [{ name: "午间休市", xAxis: times[ls], itemStyle: { color: "rgba(128,128,128,0.05)" } }, { xAxis: times[le] }]
    : null;

  let yData = prices, yMin = null, yMax = null;
  if (state.normalized) {
    yData = pcts;
    const maxAbs = Math.max(Math.max(...pcts.map((v) => Math.abs(v))), 2);
    yMin = -maxAbs; yMax = maxAbs;
  } else {
    const vals = prices.filter((v) => Number.isFinite(v));
    if (vals.length) {
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const pad = Math.max((hi - lo) * 0.15, pre_close * 0.002);
      yMin = lo - pad; yMax = hi + pad;
    }
  }

  const markLine = {
    silent: true, symbol: "none",
    label: { show: true, formatter: state.normalized ? "昨收 0.00%" : "昨收 " + fmtNum(pre_close), color: "#b3bcc9", fontSize: 10, position: "insideEndTop" },
    lineStyle: { color: "#b3bcc9", type: "dashed", width: 1 },
    data: [{ yAxis: state.normalized ? 0 : pre_close }],
  };
  const axisCommon = { axisLine: { lineStyle: { color: "#eef0f3" } }, axisLabel: { color: "#5b6675", fontSize: 10 }, splitLine: { lineStyle: { color: "#eef0f3", opacity: 0.6 } } };

  return {
    backgroundColor: "transparent",
    animation: false,
    axisPointer: { link: [{ xAxisIndex: "all" }], label: { backgroundColor: "#202939" } },
    tooltip: {
      trigger: "axis", confine: true,
      backgroundColor: "rgba(255,255,255,0.86)", borderColor: "rgba(226,230,236,0.9)", borderWidth: 1,
      padding: [4, 8],
      textStyle: { color: "#1f2530", fontSize: 11 },
      extraCssText: "box-shadow:none;line-height:1.4;border-radius:6px;",
      formatter(params) {
        const i = params[0] ? params[0].dataIndex : 0;
        const p = points[i]; if (!p) return "";
        const pct = pre_close > 0 ? ((p.price - pre_close) / pre_close) * 100 : 0;
        const dir = pct > 0 ? "#e5484d" : pct < 0 ? "#18a058" : "#5b6675";
        const sign = pct > 0 ? "+" : "";
        const lines = ["<b>" + p.time + "</b>",
          `价 <span style="color:${dir}">${fmtNum(p.price)} ${sign}${pct.toFixed(2)}%</span>`];
        if (p.avg) lines.push(`均价 ${fmtNum(p.avg)}`);
        lines.push(`量 ${fmtVol(p.vol * 100)}`);
        return lines.join("<br/>");
      },
    },
    grid: [{ left: 46, right: 12, top: 8, height: "62%" }, { left: 46, right: 12, top: "78%", height: "16%" }],
    xAxis: [
      { type: "category", data: times, boundaryGap: false, axisLine: { lineStyle: { color: "#eef0f3" } }, axisLabel: { color: "#5b6675", fontSize: 10, interval: Math.max(1, Math.floor(times.length / 5) - 1) }, axisTick: { show: false }, splitLine: { show: false }, markArea: lunchArea ? { silent: true, data: lunchArea } : undefined },
      { type: "category", data: times, show: false, gridIndex: 1 },
    ],
    yAxis: [
      { type: "value", min: yMin, max: yMax, scale: true, axisLabel: { color: "#5b6675", fontSize: 10, formatter: (v) => (state.normalized ? v.toFixed(1) + "%" : fmtNum(v)) }, splitLine: { lineStyle: { color: "#eef0f3", opacity: 0.6 } } },
      { type: "value", show: false, gridIndex: 1 },
    ],
    series: [
      { name: "价格", type: "line", data: state.normalized ? pcts : prices, showSymbol: false, smooth: false, lineStyle: { width: 1.5, color: lineColor }, itemStyle: { color: lineColor }, markLine, z: 3 },
      { name: "均价", type: "line", data: state.normalized ? avgs.map((v) => (v && pre_close > 0 ? ((v - pre_close) / pre_close) * 100 : null)) : avgs, showSymbol: false, lineStyle: { width: 1, color: "#10a3a8", opacity: 0.85 }, itemStyle: { color: "#10a3a8" }, z: 2 },
      { name: "成交量", type: "bar", xAxisIndex: 1, yAxisIndex: 1, data: vols.map((v, i) => ({ value: v, itemStyle: { color: pcts[i] > 0 ? "#e5484d" : pcts[i] < 0 ? "#18a058" : "#697586", opacity: pcts[i] === 0 ? 0.45 : 0.75 } })), barWidth: "70%" },
    ].filter(Boolean),
  };
}

function updateCharts() {
  const byKey = new Map(state.chartsData.map((c) => [keyOf(c), c]));
  Object.entries(charts).forEach(([id, ins]) => {
    // map id -> chart via DOM order
  });
  // 依据 DOM 顺序重建（charts 顺序恰好与 current 数据一致，columns 模式按板/股排）
  const area = $("#mainArea");
  const nodes = area.querySelectorAll(".smic__chart");
  nodes.forEach((node) => {
    const ins = charts[node.id]; if (!ins) return;
    // 找到对应数据：node 的卡片位于 nodes 中的索引
    const idx = Array.prototype.indexOf.call(nodes, node);
    const c = chartAt(idx);
    if (c) ins.setOption(buildChartOption(c), true);
    // 同步卡片头部价格/涨跌幅/涨跌额：增量插入或切换日期后，卡片由占位数据渲染，
    // 头部数值需随数据到位刷新，避免残留「—」或旧日期的数值
    if (c) {
      const card = node.closest(".card");
      if (card) {
        const priceEl = card.querySelector(".smic__price");
        const pctEl = card.querySelector(".smic__pct");
        const amtEl = card.querySelector(".smic__amt");
        if (priceEl) {
          priceEl.textContent = fmtNum(c.close);
          priceEl.className = "smic__price " + numCls(c.change_pct);
        }
        if (pctEl) {
          pctEl.textContent = fmtPct(c.change_pct);
          pctEl.className = "smic__pct " + numCls(c.change_pct);
        }
        if (amtEl) {
          amtEl.textContent = (c.change_amt && c.change_amt > 0 ? "+" : "") + fmtNum(c.change_amt);
          amtEl.className = "smic__amt " + numCls(c.change_amt);
        }
      }
    }
    const loading = node.parentElement.querySelector(".smic__loading");
    if (loading) loading.style.display = c && c.points && c.points.length ? "none" : "flex";
  });
}

function chartAt(idx) {
  if (state.layout === "columns") {
    const boards = state.chartsData.filter((c) => c.kind === "board");
    const stocks = state.chartsData.filter((c) => c.kind === "stock");
    const etfs = state.chartsData.filter((c) => c.kind === "etf");
    if (idx < boards.length) return boards[idx];
    if (idx < boards.length + stocks.length) return stocks[idx - boards.length];
    return etfs[idx - boards.length - stocks.length];
  }
  return state.chartsData[idx];
}

/* ---------------- 一览「放大」焦点弹层 ---------------- */
let focusIns = null;
function openFocus(k) {

/* ---------------- 纵向布局：拖拽重排 ---------------- */
// 依当前 DOM 顺序同步选中列表顺序并持久化（图表实例随卡移动不受影响）
function persistDomOrder() {
  if (state.sortByPct) return;
  const cards = Array.from($("#mainArea").querySelectorAll(".card[data-key]"));
  if (!cards.length) return;
  const byKey = new Map(state.selected.map((s) => [keyOf(s), s]));
  state.selected = cards.map((c) => byKey.get(c.dataset.key)).filter(Boolean);
  persist();
  applySelection();
}
function bindDragReorder() {
  const area = $("#mainArea");
  if (!area) return;
  let st = null;

  // 当前排布的卡片容器：纵向 .rows / 网格 .grid
  function container() {
    if (state.layout === "columns") return null;
    return area.querySelector(state.layout === "rows" ? ".rows" : ".grid");
  }
  // 真实卡片（排除占位卡）
  function realCards(c) {
    return Array.from((c || container()).children).filter(
      (n) => n.classList.contains("card") && !n.classList.contains("drag-ph")
    );
  }
  // 把 node 插到第 idx 张真卡之前（idx 末尾则 append）
  function insertAt(c, cards, node, idx) {
    const ref = cards[idx];
    if (ref && ref.parentElement === c) c.insertBefore(node, ref);
    else c.appendChild(node);
  }

  // 落位飞入：把(仍是浮动的)clone 从当前视口位置动画滑回其最终网格槽位
  const DUR = 200; // ms
  function settleToSlot(clone, fromRect) {
    requestAnimationFrame(() => {
      const end = clone.getBoundingClientRect();
      const dx = fromRect.left - end.left, dy = fromRect.top - end.top;
      clone.style.transition = "none";
      clone.style.transform = `translate(${dx}px,${dy}px)`;
      requestAnimationFrame(() => {
        clone.style.transition = `transform ${DUR}ms ease`;
        clone.style.transform = "";
        setTimeout(() => { clone.style.transition = ""; }, DUR + 40);
      });
    });
  }

  area.addEventListener("pointerdown", (e) => {
    if (state.layout !== "rows" && state.layout !== "grid") return;
    if (state.sortByPct) return; // 涨幅排序会覆盖手动顺序，暂不允许拖拽
    if (e.target.closest("button")) return;
    const head = e.target.closest(".smic__head");
    const card = head && head.closest(".card");
    if (!card) return;
    const r = card.getBoundingClientRect();
    st = {
      card, c: container(), rect: r,
      dx: e.clientX - r.left, dy: e.clientY - r.top,
      clone: null, ph: null, moving: false, startX: e.clientX, startY: e.clientY, li: -1,
    };
  });

  window.addEventListener("pointermove", (e) => {
    if (!st) return;

    // —— 从未拖动 → 开始拖动：原卡变“幽灵”，原位树占位卡 ——
    if (!st.moving) {
      if (Math.hypot(e.clientX - st.startX, e.clientY - st.startY) < 5) return; // 移动阈值（X/Y 任一方向），避免误触发
      st.moving = true;
      dragActive = true;   // 拖拽开始：阻止轮询 rebuild 弹回原位
      const { card, c, rect } = st;
      const ph = document.createElement("div");
      ph.className = "card drag-ph";
      ph.style.width = rect.width + "px";
      ph.style.height = rect.height + "px";
      card.after(ph);                 // 原位占位，占位卡保留槽位，其他卡不跳变
      st.ph = ph;
      card.classList.add("is-ghost");
      card.style.position = "fixed";
      card.style.left = "0px";         // 固定到视口原点，位置全靠下面的 translate 表达
      card.style.top = "0px";
      card.style.width = rect.width + "px";
      card.style.height = rect.height + "px";
      card.style.zIndex = "40";
      card.style.transformOrigin = "center";
      card.style.pointerEvents = "none";
      document.body.appendChild(card); // 移到 body，避免容器内布局/滚动影响
      st.clone = card;
      // 记录幽灵当前槽位（前方真卡张数）作重叠判向的基准。
      // 必须在 card 移出容器之后统计，否则被拖的卡自己会被算入，导致初始索引偏大 1。
      let liCnt = 0;
      realCards(st.c).forEach((k) => {
        if (k.compareDocumentPosition(ph) & Node.DOCUMENT_POSITION_FOLLOWING) liCnt++;
      });
      st.li = liCnt;
      document.body.style.userSelect = "none";
    }

    // —— 幽灵跟随指针（保持按下时的抓取偏移）——
    const nx = e.clientX - st.dx, ny = e.clientY - st.dy;
    st.clone.style.transform = `translate3d(${nx}px, ${ny}px, 0) scale(1.02)`;

    // —— 让位：光标越过卡片「前半区」即让位。纵向按上半区，网格按二维（先比行、行内比列）——
    const gcY = e.clientY, gcX = e.clientX;
    const cards = realCards(st.c);
    const isGrid = state.layout === "grid";
    let ti = 0;
    for (let i = 0; i < cards.length; i++) {
      const b = cards[i].getBoundingClientRect();
      let before;
      if (isGrid) {
        // 二维网格：光标在更高行（整行 top 之上），或同一行且水平在卡片中心左侧
        before = gcY < b.top || (gcY < b.bottom && gcX < b.left + b.width / 2);
      } else {
        // 纵向单列：光标在卡片垂直中心上方
        before = gcY < b.top + b.height / 2;
      }
      if (before) break;
      ti = i + 1;
    }
    if (ti !== st.li) {
      st.li = ti;
      insertAt(st.c, cards, st.ph, ti);
    }
  });

  window.addEventListener("pointerup", () => {
    if (!st) return;
    if (st.moving && st.clone && st.ph) {
      const fromRect = st.clone.getBoundingClientRect();
      st.ph.replaceWith(st.clone);    // 先落回占位槽位
      st.clone.classList.remove("is-ghost");
      st.clone.style.position = "";
      st.clone.style.left = "";
      st.clone.style.top = "";
      st.clone.style.width = "";
      st.clone.style.height = "";
      st.clone.style.zIndex = "";
      st.clone.style.pointerEvents = "";
      st.clone.style.transformOrigin = "";
      st.clone.style.transform = "";  // 清掉跟随偏移，让 getBoundingClientRect 反映真实槽位
      settleToSlot(st.clone, fromRect); // 飞入动画
      st.clone = null; st.ph = null;
      persistDomOrder();
    }
    dragActive = false;   // 拖拽结束，恢复轮询
    document.body.style.userSelect = "";
    st = null;
  });
}

/* ---------------- 事件绑定 ---------------- */
function bindSeg(id, onPick) {

    b.classList.add("is-on");
    onPick(b.dataset.v);
  });
}

  else {
    $("#poolSearch").style.display = "none";
    $("#poolBoard").style.display = tab === "board" ? "flex" : "none";
    $("#poolStock").style.display = tab === "stock" ? "flex" : "none";
    $("#poolIndex").style.display = tab === "index" ? "flex" : "none";
    $("#poolETF").style.display = tab === "etf" ? "flex" : "none";
    if (tab === "etf") renderEtfList();
  }
}));
$("#poolBoard").style.display = "flex";

$("#poolStock").style.flexDirection = "column";

$("#poolSearch").style.flexDirection = "column";

// 全局搜索：有词时切换到「板块 + 个股 + 指数」统一结果面板，同时罗列；无词时回到对应 tab 池
$("#kwGlobal").addEventListener("input", (e) => {

  state.stockKw = e.target.value;
  const kw = e.target.value.trim();
  // 搜索词变化：重置搜索结果的无限滚动增量，从首批重新渲染
  resetListLimits("search");
  if (kw) {
    if (!state.stocks.length) loadStocks(); // 搜索前未加载个股则补充
    if (!state.indices.length) loadIndices(); // 搜索前未加载指数则补充
    if (!state.etfs.length) loadEtfs(); // 搜索前未加载 ETF 则补充
    $("#poolSearch").style.display = "flex";
    $("#poolBoard").style.display = "none";
    $("#poolStock").style.display = "none";
    $("#poolIndex").style.display = "none";
    $("#poolETF").style.display = "none";
    renderSearchList();
  } else {
    $("#poolSearch").style.display = "none";
    const tab = state.activeTab;
    $("#poolBoard").style.display = tab === "board" ? "flex" : "none";
    $("#poolStock").style.display = tab === "stock" ? "flex" : "none";
    $("#poolIndex").style.display = tab === "index" ? "flex" : "none";

    renderStockList();
    renderIndexList();

/* ---------------- 轮询 ---------------- */
// 轮询 + 自动保活：除按档位周期拉取数据外，若后端刷新时间戳连续 2 轮未前进
// （说明后台刷新线程未在正常推进），自动 POST /refresh 唤醒一轮，等效于自动点「刷新」，
// 避免「分时图停住、必须手动刷新才更新」。
function startPolling() {
  stopPolling();
  let lastTs = -1, staleRounds = 0;
  pollTimer = setInterval(async () => {
    const data = await loadCharts();
    // 仅实时模式（今天）参与保活；历史日期为静态快照，无需唤醒
    if (!data || data.is_hist || !isTodaySel() || dragActive) return;
    const ts = data.ts || 0;
    if (ts > lastTs) { lastTs = ts; staleRounds = 0; }
    else if (++staleRounds >= 2) {
      staleRounds = 0;
      fetchJson(API.refresh, { method: "POST" }, 1).catch(() => {});
    }
  }, state.refreshInterval * 1000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ---------------- 初始化 ---------------- */
async function init() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    if (Array.isArray(saved)) state.selected = saved.filter((s) => s && s.code);
  } catch (e) {}
  // 恢复排布样式 / 纵轴 / 涨幅排序 / 自动刷新间隔（保存用户上次选择，避免每次刷新重选）
  try {
    const ui = JSON.parse(localStorage.getItem(UI_STORE_KEY) || "{}");
    if (ui && typeof ui === "object") {
      if (["rows", "grid", "overview", "columns"].includes(ui.layout)) state.layout = ui.layout;
      if (typeof ui.normalized === "boolean") state.normalized = ui.normalized;
      if (typeof ui.sortByPct === "boolean") state.sortByPct = ui.sortByPct;
      if ([15, 30, 60].includes(ui.refreshInterval)) state.refreshInterval = ui.refreshInterval;
    }
  } catch (e) {}
  // 同步工具栏按钮高亮到恢复后的 UI 状态
  const syncSeg = (id, val) => $$("#" + id + " button").forEach((x) => x.classList.toggle("is-on", x.dataset.v === String(val)));
  syncSeg("segLayout", state.layout);
  syncSeg("segAxis", state.normalized ? "1" : "0");
  syncSeg("segInterval", String(state.refreshInterval));
  $("#btnSort").classList.toggle("is-on", state.sortByPct);
  renderSelect();
  // 首屏不等待个股全量池：后台并行预加载，保证搜索时板块 + 个股结果即时命中
  loadStocks();
  loadIndices();
  await Promise.all([loadBoards(), loadAllBoards(), loadHealth()]);
  if (state.selected.length) syncSubscriptions();
  await loadCharts();
  if (state.selected.length) startCatchUp();
  startPolling();
  // 刷新按钮可用态由 syncStatus 依据「实时/历史」模式统一管理
  bindDragReorder();
  // 长列表无限滚动：绑定 板块/个股/ETF/指数/搜索 各列表的滚动追加
  bindListInfiniteScroll();
  window.addEventListener("resize", () => {
    Object.values(charts).forEach((c) => c.resize());
    if (focusIns) focusIns.resize();
  });
  // 从后台标签切回前台时立即拉取一次：浏览器会节流后台标签的 setInterval，
  // 避免切回时看到的仍是旧数据
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      loadCharts();
      loadHealth();
    }
  });
}
init();
