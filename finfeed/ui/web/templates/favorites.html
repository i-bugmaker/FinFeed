<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinFeed - 我的收藏</title>
<style>
:root,[data-theme="light"]{
  --bg:#f5f6f8;--bg-card:#ffffff;--bg-card-alt:#f0f1f3;--bg-hover:#eceef1;
  --text:#1a1d23;--text2:#4a5060;--text3:#7a8298;
  --border:#dde0e6;--border2:#cfd3da;
  --accent:#2563eb;--accent-h:#1d4ed8;--accent-bg:rgba(37,99,235,.08);
  --green:#16a34a;--green-bg:rgba(22,163,74,.08);
  --red:#dc2626;--red-bg:rgba(220,38,38,.08);
  --orange:#ea580c;--orange-bg:rgba(234,88,12,.08);
  --star:#f59e0b;--star-bg:rgba(245,158,11,.1);
  --shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 4px 12px rgba(0,0,0,.1);
  --fs-xs:14px;--fs-sm:16px;--fs-base:20px;--fs-md:22px;--fs-lg:26px;--fs-xl:30px;
  --lh-base:1.8;--radius:8px;
}
[data-theme="dark"]{
  --bg:#0d1117;--bg-card:#161b22;--bg-card-alt:#1c2128;--bg-hover:#1c2333;
  --text:#e6edf3;--text2:#9ba5b2;--text3:#6e7681;
  --border:#30363d;--border2:#484f58;
  --accent:#58a6ff;--accent-h:#79c0ff;--accent-bg:rgba(88,166,255,.1);
  --green:#3fb950;--green-bg:rgba(63,185,80,.1);
  --red:#f85149;--red-bg:rgba(248,81,73,.1);
  --orange:#d29922;--orange-bg:rgba(210,153,34,.1);
  --star:#f0b429;--star-bg:rgba(240,180,41,.15);
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 12px rgba(0,0,0,.4);
  --fs-xs:14px;--fs-sm:16px;--fs-base:20px;--fs-md:22px;--fs-lg:26px;--fs-xl:30px;
  --lh-base:1.8;--radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans CN","WenQuanYi Micro Hei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:24px;font-size:var(--fs-base);line-height:var(--lh-base);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}

.nav-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.nav-brand{color:var(--accent);font-size:var(--fs-lg);font-weight:700;letter-spacing:-.3px;white-space:nowrap;display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.nav-brand:hover{color:var(--accent-h)}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-link{color:var(--text2);text-decoration:none;padding:10px 20px;border-radius:var(--radius);font-size:var(--fs-sm);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav-link:hover{background:var(--bg-hover);color:var(--text)}
.nav-link.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green-bg)}
.status-dot.error{background:var(--red);box-shadow:0 0 6px var(--red-bg)}
.status-text{font-size:var(--fs-sm);color:var(--text2);white-space:nowrap}
.nav-clock{font-size:var(--fs-sm);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;padding:0 8px;border-left:1px solid var(--border);margin-left:4px}
.theme-toggle{background:var(--bg-card-alt);color:var(--text2);border:1px solid var(--border);width:44px;height:44px;border-radius:var(--radius);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}

.toolbar{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 24px;margin-bottom:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.search-box{position:relative;display:flex;align-items:center;flex:1;min-width:280px}
.search-box input{background:var(--bg-card-alt);color:var(--text);border:1px solid var(--border);padding:12px 44px;border-radius:var(--radius);font-size:var(--fs-sm);font-family:inherit;width:100%;outline:none}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search-box .ico{position:absolute;left:14px;color:var(--text3);font-size:var(--fs-md);pointer-events:none}
.search-clear{position:absolute;right:12px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;line-height:1}
.search-clear:hover{background:var(--bg-hover);color:var(--text)}
.search-clear.show{display:flex}
.btn{background:var(--bg-card-alt);color:var(--text2);border:1px solid var(--border);padding:12px 20px;border-radius:var(--radius);cursor:pointer;font-size:var(--fs-sm);font-family:inherit;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-hover)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{opacity:.9;color:#fff}
.btn-export{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.btn-export:hover{background:var(--green);color:#fff}

table{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
thead th{background:var(--bg-card-alt);color:var(--text);padding:18px 20px;text-align:left;position:sticky;top:0;border-bottom:2px solid var(--border);font-weight:600;font-size:var(--fs-sm);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg-hover)}
tbody td{padding:18px 20px;vertical-align:middle}

.col-fav{width:52px;padding:0!important;text-align:center}
.fav-btn{background:none;border:none;cursor:pointer;font-size:24px;color:var(--star);padding:8px;border-radius:var(--radius);line-height:1;transition:transform .1s}
.fav-btn:hover{transform:scale(1.1)}
.col-time{color:var(--text3);width:180px;white-space:nowrap;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.col-source{width:130px;font-size:var(--fs-sm);min-width:130px}
.src-tag{padding:6px 14px;border-radius:16px;font-size:var(--fs-xs);font-weight:600;display:inline-block;white-space:nowrap;border:1px solid}
.col-title{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.col-title a{color:var(--text);text-decoration:none;font-weight:500}
.col-title a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.col-title mark{background:var(--orange-bg);color:var(--orange);padding:0 4px;border-radius:2px;font-weight:600}
.col-intro{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2);font-size:var(--fs-sm)}

.empty{text-align:center;padding:100px 20px;color:var(--text3)}
.empty .ico{font-size:80px;margin-bottom:16px;opacity:.4}
.empty .title{font-size:var(--fs-md);font-weight:500;color:var(--text2);margin-bottom:10px}
.empty .desc{font-size:var(--fs-sm);color:var(--text3);margin-bottom:20px}

.loading-indicator{text-align:center;padding:24px 0;color:var(--text3);font-size:var(--fs-sm)}
.loading-indicator .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.end-indicator{text-align:center;padding:24px 0;color:var(--text3);font-size:var(--fs-sm)}

.export-menu{position:relative;display:inline-block}
.export-dropdown{display:none;position:absolute;top:100%;right:0;margin-top:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:100;min-width:160px;overflow:hidden}
.export-dropdown.show{display:block}
.export-dropdown button{display:block;width:100%;text-align:left;padding:12px 20px;background:none;border:none;color:var(--text2);font-size:var(--fs-sm);font-family:inherit;cursor:pointer;white-space:nowrap}
.export-dropdown button:hover{background:var(--accent-bg);color:var(--accent)}

.toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;min-width:340px;pointer-events:auto;border-left:4px solid var(--accent)}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast .toast-icon{font-size:var(--fs-lg);flex-shrink:0}
.toast .toast-content{flex:1}
.toast .toast-title{font-size:var(--fs-sm);font-weight:600;color:var(--text);margin-bottom:4px}
.toast .toast-msg{font-size:var(--fs-xs);color:var(--text2)}
.toast .toast-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;opacity:.6}
.toast-out{opacity:0;pointer-events:none}

@media(max-width:768px){
  body{padding:12px}
  .nav-inner{flex-direction:column;align-items:stretch}
  .nav-clock{display:none}
  .toolbar{flex-direction:column;align-items:stretch}
  .search-box{min-width:auto}
  .col-time{width:130px;font-size:var(--fs-xs)}
  .col-source{width:100px}
  .col-intro{display:none}
}
</style>
</head>
<body>

<div class="nav-bar">
  <div class="nav-inner">
    <a href="/" class="nav-brand">📰 FinFeed</a>
    <nav class="nav-links">
      <a href="/" class="nav-link">📰 财经新闻</a>
      <a href="/sentiment" class="nav-link">💬 舆情监控</a>
      <a href="/favorites" class="nav-link active">⭐ 我的收藏</a>
      <a href="/dashboard" class="nav-link">📊 数据大屏</a>
    </nav>
    <div class="nav-right">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">连接中...</span>
      <span class="nav-clock" id="navClock">--:--:--</span>
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="search-box">
    <span class="ico">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索收藏的新闻..." autocomplete="off">
    <button class="search-clear" id="searchClear">✕</button>
  </div>
  <button class="btn btn-primary" onclick="loadFavs()">🔄 刷新</button>
  <div class="export-menu">
    <button class="btn btn-export" onclick="toggleExportMenu()">📥 导出 ▾</button>
    <div class="export-dropdown" id="exportDropdown">
      <button onclick="exportFavs('json')">📄 JSON 格式</button>
      <button onclick="exportFavs('csv')">📊 CSV 表格</button>
      <button onclick="exportFavs('markdown')">📝 Markdown</button>
    </div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th class="col-fav"></th>
      <th class="col-time">时间</th>
      <th class="col-source">来源</th>
      <th>标题</th>
      <th class="col-intro">简介</th>
    </tr>
  </thead>
  <tbody id="favBody">
    <tr><td colspan="5" style="text-align:center;padding:60px"><div class="empty"><div class="ico">⏳</div><div class="title">加载中...</div></div></td></tr>
  </tbody>
</table>
<div id="loadIndicator" class="loading-indicator" style="display:none">
  <span class="spinner"></span>加载更多...
</div>
<div id="endIndicator" class="end-indicator" style="display:none">
  — 已经到底啦 —
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const PAGE_SIZE=30;
let state={offset:0,keyword:'',total:0,news:[],stats:{},sse:null,loading:false,hasMore:true};
const srcColorMap={};
function hashColor(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}return`hsl(${Math.abs(h)%360},60%,45%)`;}
function getSrcColor(n){if(!srcColorMap[n])srcColorMap[n]=hashColor(n);return srcColorMap[n];}
function getTheme(){try{return document.documentElement.getAttribute('data-theme')||'light';}catch(e){return'light';}}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('finfeed_theme',t);}catch(e){}}
function toggleTheme(){setTheme(getTheme()==='dark'?'light':'dark');}
try{const s=localStorage.getItem('finfeed_theme');if(s)setTheme(s);}catch(e){}
function escHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function highlight(t,kw){if(!kw||!t)return escHtml(t);try{return escHtml(t).replace(new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<mark>$1</mark>');}catch(e){return escHtml(t);}}
function fmtTime(ts){if(!ts)return'-';const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function updateClock(){const now=new Date();const p=n=>String(n).padStart(2,'0');const str=`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;const el=document.getElementById('navClock');if(el)el.textContent=str;}
setInterval(updateClock,1000);updateClock();
function toast(msg,type='info'){const c=document.getElementById('toastContainer');const icons={success:'✅',error:'❌',info:'ℹ️'};const el=document.createElement('div');el.className=`toast ${type}`;el.innerHTML=`<span class="toast-icon">${icons[type]||'ℹ️'}</span><div class="toast-content"><div class="toast-msg">${msg}</div></div><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;c.appendChild(el);setTimeout(()=>{el.classList.add('toast-out');setTimeout(()=>el.remove(),300);},3500);}
function toggleExportMenu(){document.getElementById('exportDropdown').classList.toggle('show');}
document.addEventListener('click',(e)=>{if(!e.target.closest('.export-menu'))document.getElementById('exportDropdown').classList.remove('show');});

async function apiToggleFavorite(id,btn){
  try{const resp=await fetch('/api/favorite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const data=await resp.json();
    if(data.success){
      if(!data.is_favorite){const row=btn.closest('tr');if(row){row.style.transition='opacity .3s';row.style.opacity='0';setTimeout(()=>loadFavs(true),300);}toast('已取消收藏');}
      btn.classList.toggle('active',data.is_favorite);
    }
  }catch(e){toast('操作失败','error');}
}

async function loadFavs(reset=true){
  if(state.loading)return;
  state.loading=true;
  document.getElementById('loadIndicator').style.display='block';
  document.getElementById('endIndicator').style.display='none';

  try{
    if(reset){
      state.offset=0;
      state.news=[];
      state.hasMore=true;
    }
    const params=new URLSearchParams();
    params.set('offset',state.offset);
    params.set('limit',PAGE_SIZE);
    if(state.keyword)params.set('keyword',state.keyword);
    const resp=await fetch(`/api/favorites?${params}`);
    const data=await resp.json();
    const newItems=data.news||[];
    state.total=data.total||0;
    state.stats=data.stats||{};

    if(reset){
      state.news=newItems;
    }else{
      state.news=[...state.news,...newItems];
    }
    state.hasMore=!!data.has_more;
    if(data.next_offset!==undefined&&data.next_offset!==null){
      state.offset=data.next_offset;
    }else{
      state.offset+=newItems.length;
    }
    renderFavs(reset);
  }catch(e){
    if(reset){
      document.getElementById('favBody').innerHTML=`<tr><td colspan="5" style="text-align:center;padding:60px"><div class="empty"><div class="ico">⚠️</div><div class="title">加载失败</div><button class="btn btn-primary" onclick="loadFavs()">重试</button></div></td></tr>`;
    }
  }finally{
    state.loading=false;
    document.getElementById('loadIndicator').style.display='none';
    if(!state.hasMore){
      document.getElementById('endIndicator').style.display='block';
    }else{
      setTimeout(checkAndLoadMore, 100);
    }
  }
}

function renderFavs(reset=false){
  const tb=document.getElementById('favBody');
  if(!state.news.length){
    tb.innerHTML=`<tr><td colspan="5"><div class="empty"><div class="ico">⭐</div><div class="title">还没有收藏任何内容</div><div class="desc">浏览新闻或舆情时点击 ☆ 按钮即可收藏</div><div style="display:flex;gap:12px;justify-content:center"><a href="/" class="btn btn-primary">📰 去看新闻</a><a href="/sentiment" class="btn">💬 去看舆情</a></div></div></td></tr>`;
    return;
  }
  function renderItem(item){
    const color=getSrcColor(item.source);
    return`<tr data-id="${item.id}">
      <td class="col-fav"><button class="fav-btn active" onclick="apiToggleFavorite(${item.id},this)" title="取消收藏">★</button></td>
      <td class="col-time">${fmtTime(item.publish_ts)}</td>
      <td class="col-source"><span class="src-tag" style="color:${color};background:${color}15;border-color:${color}40">${escHtml(item.source)}</span></td>
      <td class="col-title"><a href="${escHtml(item.url)}" target="_blank" rel="noopener">${highlight(item.title,state.keyword)}</a></td>
      <td class="col-intro" title="${escHtml(item.intro||'')}">${highlight(item.intro||'',state.keyword)}</td>
    </tr>`;
  }
  if(reset){
    tb.innerHTML=state.news.map(renderItem).join('');
  }else{
    const existingCount=tb.querySelectorAll('tr[data-id]').length;
    const newItems=state.news.slice(existingCount);
    if(newItems.length){
      tb.insertAdjacentHTML('beforeend',newItems.map(renderItem).join(''));
    }
  }
}

function checkAndLoadMore(){
  if(state.loading||!state.hasMore)return;
  const scrollTop=window.scrollY||document.documentElement.scrollTop;
  const windowHeight=window.innerHeight;
  const docHeight=document.documentElement.scrollHeight;
  if(docHeight<=windowHeight||scrollTop+windowHeight>=docHeight-300){
    loadFavs(false);
  }
}

function handleScroll(){
  checkAndLoadMore();
}

const si=document.getElementById('searchInput');const sc=document.getElementById('searchClear');let st;
si.addEventListener('input',()=>{sc.classList.toggle('show',!!si.value);clearTimeout(st);st=setTimeout(()=>{state.keyword=si.value.trim();loadFavs(true);},400);});
sc.addEventListener('click',()=>{si.value='';state.keyword='';sc.classList.remove('show');loadFavs(true);si.focus();});

function exportFavs(fmt){
  document.getElementById('exportDropdown').classList.remove('show');
  window.location.href=`/api/export?format=${fmt}&favorites=1`;
  toast(`正在导出 ${fmt.toUpperCase()} 文件...`,'success');
}

function connectSSE(){
  if(state.sse)return;
  try{
    state.sse=new EventSource('/api/events');
    state.sse.addEventListener('connected',()=>{
      document.getElementById('statusDot').className='status-dot';
      document.getElementById('statusText').textContent='实时连接';
    });
    state.sse.addEventListener('news',(e)=>{
      try{
        const d=JSON.parse(e.data);
        if(d.type==='new_news'&&d.items&&d.items.length){
          const hasFav=d.items.some(item=>item.is_favorite);
          if(hasFav&&state.offset<=PAGE_SIZE&&!state.keyword){
            setTimeout(()=>loadFavs(true),1000);
          }
        }
      }catch(err){}
    });
    state.sse.onerror=()=>{
      document.getElementById('statusDot').className='status-dot error';
      document.getElementById('statusText').textContent='重连中...';
      state.sse=null;
      setTimeout(connectSSE,5000);
    };
  }catch(e){
    document.getElementById('statusDot').className='status-dot error';
    document.getElementById('statusText').textContent='轮询模式';
  }
}

window.addEventListener('scroll',handleScroll,{passive:true});

loadFavs(true);
connectSSE();
</script>
</body>
</html>
