<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinFeed 数据可视化大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#0d1117;--bg-card:#161b22;--bg-card-alt:#1c2128;--bg-hover:#1c2333;
  --text:#e6edf3;--text2:#9ba5b2;--text3:#6e7681;
  --border:#30363d;--border2:#484f58;
  --accent:#58a6ff;--accent-h:#79c0ff;--accent-bg:rgba(88,166,255,.1);
  --green:#3fb950;--green-bg:rgba(63,185,80,.1);
  --red:#f85149;--red-bg:rgba(248,81,73,.1);
  --orange:#d29922;--orange-bg:rgba(210,153,34,.1);
  --purple:#bc8cff;--purple-bg:rgba(188,140,255,.1);
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 12px rgba(0,0,0,.4);
  --fs-xs:14px;--fs-sm:16px;--fs-base:20px;--fs-md:22px;--fs-lg:26px;--fs-xl:30px;
  --lh-base:1.8;--radius:8px;
  --chart-axis:#6e7681;--chart-split:rgba(88,166,255,.08);
}
[data-theme="light"]{
  --bg:#f5f6f8;--bg-card:#ffffff;--bg-card-alt:#f0f1f3;--bg-hover:#eceef1;
  --text:#1a1d23;--text2:#4a5060;--text3:#7a8298;
  --border:#dde0e6;--border2:#cfd3da;
  --accent:#2563eb;--accent-h:#1d4ed8;--accent-bg:rgba(37,99,235,.08);
  --green:#16a34a;--green-bg:rgba(22,163,74,.08);
  --red:#dc2626;--red-bg:rgba(220,38,38,.08);
  --orange:#ea580c;--orange-bg:rgba(234,88,12,.08);
  --purple:#9333ea;--purple-bg:rgba(147,51,234,.08);
  --shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 4px 12px rgba(0,0,0,.1);
  --fs-xs:14px;--fs-sm:16px;--fs-base:20px;--fs-md:22px;--fs-lg:26px;--fs-xl:30px;
  --lh-base:1.8;--radius:8px;
  --chart-axis:#7a8298;--chart-split:rgba(37,99,235,.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans CN","WenQuanYi Micro Hei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    font-size: var(--fs-base);
    line-height: var(--lh-base);
    padding:24px;
}

.nav-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.nav-brand{color:var(--accent);font-size:var(--fs-lg);font-weight:700;letter-spacing:-.3px;white-space:nowrap;display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.nav-brand:hover{color:var(--accent-h)}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-link{color:var(--text2);text-decoration:none;padding:10px 20px;border-radius:var(--radius);font-size:var(--fs-sm);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav-link:hover{background:var(--bg-hover);color:var(--text)}
.nav-link.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green-bg)}
.status-dot.error{background:var(--red);box-shadow:0 0 6px var(--red-bg)}
.status-text{font-size:var(--fs-xs);color:var(--text2)}
.theme-toggle{background:var(--bg-card-alt);color:var(--text2);border:1px solid var(--border);width:44px;height:44px;border-radius:var(--radius);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}

.header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    background: var(--bg-card);
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:20px;
    flex-wrap: wrap;
    gap: 16px;
    box-shadow:var(--shadow);
}
.header-left {
    display: flex;
    align-items: center;
    gap: 16px;
}
.header h1 {
    color: var(--accent);
    font-size: var(--fs-xl);
    font-weight: 700;
    letter-spacing: 2px;
    white-space: nowrap;
}
.header .subtitle {
    color: var(--text3);
    font-size: var(--fs-sm);
}
.header-center {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}
.fullscreen-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: var(--fs-sm);
    font-family: inherit;
    font-weight:500;
    display: flex;
    align-items: center;
    gap: 8px;
}
.fullscreen-btn:hover {
    opacity: .9;
}
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    padding: 0;
    max-width: 1800px;
    margin: 0 auto 20px;
}
.stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    text-align: center;
    box-shadow:var(--shadow);
}
.stat-card .number {
    font-size: var(--fs-xl);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
}
.stat-card .label {
    color: var(--text2);
    font-size: var(--fs-sm);
    margin-top: 8px;
}
.stat-card .change {
    font-size: var(--fs-xs);
    margin-top: 6px;
}
.stat-card .change.up {
    color: var(--green);
}
.stat-card .change.down {
    color: var(--red);
}
.charts-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    padding: 0;
    max-width: 1800px;
    margin: 0 auto 20px;
}
.chart-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    height: 360px;
    box-shadow:var(--shadow);
}
.chart-box h3 {
    color: var(--text);
    font-size: var(--fs-base);
    font-weight: 600;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}
.chart {
    width: 100%;
    height: calc(100% - 50px);
}
.news-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin: 0;
    max-width: 1800px;
    margin:0 auto 20px;
    box-shadow:var(--shadow);
}
.news-section .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
}
.news-section h3 {
    color: var(--text);
    font-size: var(--fs-lg);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}
.news-section .view-all {
    color: var(--accent);
    font-size: var(--fs-sm);
    text-decoration: none;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
}
.news-section .view-all:hover {
    border-color: var(--accent);
    background: var(--accent-bg);
}
.news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
}
.news-card {
    display: flex;
    gap: 14px;
    padding: 16px 18px;
    background: var(--bg-card-alt);
    border-radius: 8px;
    border: 1px solid transparent;
}
.news-card:hover {
    border-color: var(--border);
}
.news-card .news-indicator {
    width: 5px;
    flex-shrink: 0;
    border-radius: 3px;
    margin-top: 4px;
}
.news-card .news-indicator.high {
    background: var(--red);
}
.news-card .news-indicator.medium {
    background: var(--orange);
}
.news-card .news-indicator.low {
    background: var(--accent);
}
.news-card .news-content {
    flex: 1;
    min-width: 0;
}
.news-card .news-title {
    color: var(--text);
    font-size: var(--fs-sm);
    font-weight: 500;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
}
.news-card .news-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.news-card .news-source {
    padding: 4px 12px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 8px;
    font-size: var(--fs-xs);
    font-weight: 500;
}
.news-card .news-time {
    color: var(--text3);
    font-size: var(--fs-xs);
    font-variant-numeric: tabular-nums;
}
.news-card .news-category {
    padding: 4px 12px;
    background: var(--bg-hover);
    color: var(--text2);
    border-radius: 8px;
    font-size: var(--fs-xs);
}
.footer {
    text-align: center;
    padding: 16px;
    color: var(--text3);
    font-size: var(--fs-xs);
}
@media (min-width: 1920px) {
    .charts-grid {
        grid-template-columns: repeat(5, 1fr);
    }
    .stat-card .number {
        font-size: 40px;
    }
    .chart-box {
        height: 380px;
    }
}
@media (max-width: 1600px) {
    .charts-grid {
        grid-template-columns: repeat(3, 1fr);
    }
    .chart-box {
        height: 320px;
    }
}
@media (max-width: 1200px) {
    .charts-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    .stat-card .number {
        font-size: var(--fs-lg);
    }
}
@media (max-width: 768px) {
    body{padding:12px;font-size:var(--fs-sm);--fs-base:16px}
    .nav-bar{padding:12px 16px}
    .nav-link{padding:8px 14px;font-size:var(--fs-xs)}
    .charts-grid {
        grid-template-columns: 1fr;
    }
    .stats-row {
        grid-template-columns: repeat(2, 1fr);
    }
    .stat-card {
        padding: 16px;
    }
    .stat-card .number {
        font-size: var(--fs-lg);
    }
    .header {
        flex-direction: column;
        text-align: center;
        padding:14px 16px;
    }
    .header-left, .header-center, .header-right {
        width: 100%;
        justify-content: center;
    }
    .header h1 {
        font-size: var(--fs-lg);
    }
    .nav-inner{gap:12px}
    .nav-links{order:3;width:100%;justify-content:center}
}
</style>
</head>
<body>
<div class="nav-bar">
  <div class="nav-inner">
    <a href="/" class="nav-brand">📰 FinFeed</a>
    <nav class="nav-links">
      <a href="/" class="nav-link" id="nav-news">📰 财经新闻</a>
      <a href="/sentiment" class="nav-link" id="nav-sentiment">💬 舆情监控</a>
      <a href="/favorites" class="nav-link" id="nav-favorites">⭐ 我的收藏</a>
      <a href="/dashboard" class="nav-link active" id="nav-dashboard">📊 数据大屏</a>
    </nav>
    <div class="nav-right">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">加载中...</span>
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
    </div>
  </div>
</div>

<div class="header">
    <div class="header-left">
        <h1>📊 FinFeed 数据大屏</h1>
    </div>
    <div class="header-center">
        <span class="subtitle" id="updateTime">加载中...</span>
    </div>
    <div class="header-right">
        <button class="fullscreen-btn" onclick="toggleFullscreen()" title="全屏显示">🔍 全屏</button>
    </div>
</div>

<div class="stats-row">
    <div class="stat-card">
        <div class="number" id="totalNews">0</div>
        <div class="label">新闻总数</div>
        <div class="change" id="totalChange"></div>
    </div>
    <div class="stat-card">
        <div class="number" id="total24h">0</div>
        <div class="label">24小时新增</div>
        <div class="change" id="hourlyChange"></div>
    </div>
    <div class="stat-card">
        <div class="number" id="sourceCount">0</div>
        <div class="label">信息来源</div>
    </div>
    <div class="stat-card">
        <div class="number" id="posRate">-</div>
        <div class="label">正面情绪占比</div>
    </div>
</div>

<div class="charts-grid">
    <div class="chart-box">
        <h3>📊 来源分布</h3>
        <div class="chart" id="sourceChart"></div>
    </div>
    <div class="chart-box">
        <h3>📈 发布趋势</h3>
        <div class="chart" id="trendChart"></div>
    </div>
    <div class="chart-box">
        <h3>😊 情绪分布</h3>
        <div class="chart" id="sentimentChart"></div>
    </div>
    <div class="chart-box">
        <h3>📁 分类分布</h3>
        <div class="chart" id="categoryChart"></div>
    </div>
    <div class="chart-box">
        <h3>⭐ 重要性分布</h3>
        <div class="chart" id="importanceChart"></div>
    </div>
</div>

<div class="news-section">
    <div class="section-header">
        <h3>📰 最新新闻</h3>
        <a href="/" class="view-all">查看全部 ›</a>
    </div>
    <div class="news-grid" id="newsList">
        <div class="news-card">
            <div class="news-indicator low"></div>
            <div class="news-content">
                <div class="news-title">加载中...</div>
                <div class="news-meta">
                    <span class="news-source">-</span>
                    <span class="news-time">-</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="footer">FinFeed 实时财经新闻监控系统 | 数据每 30 秒自动刷新</div>

<script>
let sourceChart, trendChart, sentimentChart, categoryChart, importanceChart;
let lastData = null;

function getTheme() {
    try { return document.documentElement.getAttribute('data-theme') || 'dark'; }
    catch(e) { return 'dark'; }
}

function getThemeColors() {
    const t = getTheme();
    if (t === 'light') {
        return {
            axis: '#7a8298',
            split: 'rgba(37,99,235,0.08)',
            barGrad1: '#2563eb',
            barGrad2: '#1d4ed8',
            line: '#16a34a',
            lineArea1: 'rgba(22,163,74,0.25)',
            lineArea2: 'rgba(22,163,74,0)',
            pos: '#16a34a',
            neu: '#ea580c',
            neg: '#dc2626',
            pieColors: ['#2563eb','#16a34a','#ea580c','#db2777','#9333ea','#0891b2','#f97316','#3b82f6'],
            impColors: ['#dc2626','#ea580c','#ca8a04','#3b82f6','#94a3b8'],
            labelEmphasis: '#1a1d23'
        };
    }
    return {
        axis: '#6e7681',
        split: 'rgba(88,166,255,0.08)',
        barGrad1: '#58a6ff',
        barGrad2: '#1d4ed8',
        line: '#3fb950',
        lineArea1: 'rgba(63,185,80,0.25)',
        lineArea2: 'rgba(63,185,80,0)',
        pos: '#3fb950',
        neu: '#d29922',
        neg: '#f85149',
        pieColors: ['#58a6ff','#3fb950','#d29922','#bc8cff','#9333ea','#66ffcc','#ff9966','#6699ff'],
        impColors: ['#f85149','#d29922','#ffdd33','#66ccff','#99aabb'],
        labelEmphasis: '#fff'
    };
}

function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const btn = document.getElementById('themeBtn');
    btn.innerHTML = t === 'dark' ? '☀️' : '🌙';
    btn.title = t === 'dark' ? '切换到亮色主题' : '切换到暗色主题';
    try { localStorage.setItem('finfeed_theme', t); } catch(e) {}
    if (sourceChart) {
        sourceChart.dispose();
        trendChart.dispose();
        sentimentChart.dispose();
        categoryChart.dispose();
        importanceChart.dispose();
    }
    initCharts();
    if (lastData) updateCharts(lastData);
}

function toggleTheme() {
    setTheme(getTheme() === 'dark' ? 'light' : 'dark');
}

function updateFullscreenBtn() {
    const btn = document.querySelector('.fullscreen-btn');
    if (btn) {
        if (document.fullscreenElement) {
            btn.innerHTML = '⛶ 退出全屏';
            btn.title = '退出全屏';
        } else {
            btn.innerHTML = '🔍 全屏';
            btn.title = '全屏显示';
        }
    }
}

function updateStatus(ok) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    if (dot && text) {
        if (ok) {
            dot.classList.remove('error');
            text.textContent = '已连接';
        } else {
            dot.classList.add('error');
            text.textContent = '连接错误';
        }
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(e => {});
    } else {
        document.exitFullscreen().catch(e => {});
    }
}

document.addEventListener('fullscreenchange', () => {
    updateFullscreenBtn();
    setTimeout(() => {
        if (sourceChart) sourceChart.resize();
        if (trendChart) trendChart.resize();
        if (sentimentChart) sentimentChart.resize();
        if (categoryChart) categoryChart.resize();
        if (importanceChart) importanceChart.resize();
    }, 100);
});

updateFullscreenBtn();

try {
    const saved = localStorage.getItem('finfeed_theme');
    if (saved) setTheme(saved);
} catch(e) {}

function initCharts() {
    sourceChart = echarts.init(document.getElementById('sourceChart'));
    trendChart = echarts.init(document.getElementById('trendChart'));
    sentimentChart = echarts.init(document.getElementById('sentimentChart'));
    categoryChart = echarts.init(document.getElementById('categoryChart'));
    importanceChart = echarts.init(document.getElementById('importanceChart'));

    window.addEventListener('resize', () => {
        sourceChart.resize();
        trendChart.resize();
        sentimentChart.resize();
        categoryChart.resize();
        importanceChart.resize();
    });
}

function updateCharts(data) {
    lastData = data;
    const c = getThemeColors();

    document.getElementById('totalNews').textContent = (data.total_news||0).toLocaleString();
    document.getElementById('total24h').textContent = (data.total_24h||0).toLocaleString();
    document.getElementById('sourceCount').textContent = data.source_count||0;

    const total = (data.sentiment_stats?data.sentiment_stats.positive:0) + (data.sentiment_stats?data.sentiment_stats.negative:0) + (data.sentiment_stats?data.sentiment_stats.neutral:0);
    const posRate = total > 0 ? ((data.sentiment_stats.positive / total) * 100).toFixed(1) + '%' : '-';
    document.getElementById('posRate').textContent = posRate;

    document.getElementById('updateTime').textContent = '更新时间: ' + (data.update_time||'');

    if (data.total_change !== undefined) {
        const tc = document.getElementById('totalChange');
        tc.textContent = data.total_change >= 0 ? '+' + data.total_change : data.total_change;
        tc.className = 'change ' + (data.total_change >= 0 ? 'up' : 'down');
    }
    if (data.hourly_change !== undefined) {
        const hc = document.getElementById('hourlyChange');
        hc.textContent = data.hourly_change >= 0 ? '+' + data.hourly_change : data.hourly_change;
        hc.className = 'change ' + (data.hourly_change >= 0 ? 'up' : 'down');
    }

    const sourceData = Object.entries(data.source_stats||{})
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .map(([name, value]) => ({ name, value }));

    sourceChart.setOption({
        tooltip: { trigger: 'item' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'value', axisLabel: { color: c.axis }, splitLine: { lineStyle: { color: c.split } } },
        yAxis: { type: 'category', data: sourceData.map(d => d.name).reverse(), axisLabel: { color: c.axis } },
        series: [{
            type: 'bar',
            data: sourceData.map(d => d.value).reverse(),
            itemStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                    { offset: 0, color: c.barGrad1 },
                    { offset: 1, color: c.barGrad2 }
                ])
            },
            barWidth: '60%'
        }]
    });

    trendChart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'category', data: (data.time_trend||[]).map(d => d.time), axisLabel: { color: c.axis } },
        yAxis: { type: 'value', axisLabel: { color: c.axis }, splitLine: { lineStyle: { color: c.split } } },
        series: [{
            type: 'line',
            data: (data.time_trend||[]).map(d => d.count),
            smooth: true,
            lineStyle: { color: c.line, width: 2 },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: c.lineArea1 },
                    { offset: 1, color: c.lineArea2 }
                ])
            },
            itemStyle: { color: c.line }
        }]
    });

    const sentimentData = [
        { name: '正面', value: data.sentiment_stats?data.sentiment_stats.positive:0, itemStyle: { color: c.pos } },
        { name: '中性', value: data.sentiment_stats?data.sentiment_stats.neutral:0, itemStyle: { color: c.neu } },
        { name: '负面', value: data.sentiment_stats?data.sentiment_stats.negative:0, itemStyle: { color: c.neg } }
    ];
    sentimentChart.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        legend: { bottom: 0, textStyle: { color: c.axis } },
        series: [{
            type: 'pie',
            radius: ['40%', '70%'],
            center: ['50%', '45%'],
            avoidLabelOverlap: false,
            label: { show: false },
            emphasis: {
                label: { show: true, fontSize: 18, fontWeight: 'bold', color: c.labelEmphasis }
            },
            data: sentimentData
        }]
    });

    const catData = Object.entries(data.category_stats||{})
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);
    categoryChart.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        legend: { type: 'scroll', bottom: 0, textStyle: { color: c.axis, fontSize: 12 } },
        series: [{
            type: 'pie',
            radius: ['35%', '65%'],
            center: ['50%', '42%'],
            data: catData.map(([name, value]) => ({ name, value })),
            label: { show: false }
        }],
        color: c.pieColors
    });

    const impData = data.importance_distribution||{};
    importanceChart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: {
            type: 'category',
            data: ['极重要', '重要', '一般', '较低', '低'],
            axisLabel: { color: c.axis }
        },
        yAxis: { type: 'value', axisLabel: { color: c.axis }, splitLine: { lineStyle: { color: c.split } } },
        series: [{
            type: 'bar',
            data: [impData['极重要'] || 0, impData['重要'] || 0, impData['一般'] || 0, impData['较低'] || 0, impData['低'] || 0],
            itemStyle: {
                color: function(params) {
                    return c.impColors[params.dataIndex];
                }
            },
            barWidth: '50%'
        }]
    });
}

function updateNewsList(news) {
    const container = document.getElementById('newsList');
    if (!news || news.length === 0) {
        container.innerHTML = `
            <div class="news-card">
                <div class="news-indicator low"></div>
                <div class="news-content">
                    <div class="news-title">暂无新闻</div>
                    <div class="news-meta">
                        <span class="news-source">-</span>
                        <span class="news-time">-</span>
                    </div>
                </div>
            </div>
        `;
        return;
    }

    function getImportanceLevel(imp) {
        if (typeof imp === 'number') {
            if (imp >= 8) return 'high';
            if (imp >= 6.5) return 'high';
            if (imp >= 5) return 'medium';
            return 'low';
        }
        const map = { '极重要': 'high', '重要': 'high', '一般': 'medium', '较低': 'low', '低': 'low' };
        return map[imp] || 'low';
    }

    container.innerHTML = news.map(item => {
        const impLevel = getImportanceLevel(item.importance);
        const category = item.category || '';
        return `
            <div class="news-card">
                <div class="news-indicator ${impLevel}"></div>
                <div class="news-content">
                    <div class="news-title">${item.title||''}</div>
                    <div class="news-meta">
                        <span class="news-source">${item.source||''}</span>
                        <span class="news-time">${item.publish_time||''}</span>
                        ${category ? `<span class="news-category">${category}</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

async function loadData() {
    try {
        const resp = await fetch('/api/stats');
        const data = await resp.json();
        updateCharts(data);

        const newsResp = await fetch('/api/news?limit=12');
        const newsData = await newsResp.json();
        updateNewsList(newsData.news || []);
        updateStatus(true);
    } catch (e) {
        console.error('加载数据失败:', e);
        updateStatus(false);
    }
}

initCharts();
loadData();
setInterval(loadData, 30000);
</script>
