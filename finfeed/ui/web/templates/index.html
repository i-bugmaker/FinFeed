<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinFeed 实时财经新闻监控</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root,[data-theme="light"]{
  --bg:#f5f6f8;--bg-card:#ffffff;--bg-card-alt:#f0f1f3;--bg-hover:#eceef1;
  --text:#1a1d23;--text2:#4a5060;--text3:#7a8298;
  --border:#dde0e6;--border2:#cfd3da;
  --accent:#2563eb;--accent-h:#1d4ed8;--accent-bg:rgba(37,99,235,.08);
  --green:#16a34a;--green-bg:rgba(22,163,74,.08);
  --red:#dc2626;--red-bg:rgba(220,38,38,.08);
  --orange:#ea580c;--orange-bg:rgba(234,88,12,.08);
  --purple:#9333ea;--purple-bg:rgba(147,51,234,.08);
  --star:#f59e0b;--star-bg:rgba(245,158,11,.1);
  --shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 4px 12px rgba(0,0,0,.1);
  --fs-xs:14px;--fs-sm:16px;--fs-base:20px;--fs-md:22px;--fs-lg:26px;--fs-xl:30px;
  --lh-base:1.8;--radius:8px;
}
[data-theme="dark"]{
  --bg:#0d1117;--bg-card:#161b22;--bg-card-alt:#1c2128;--bg-hover:#1c2333;
  --text:#e6edf3;--text2:#9ba5b2;--text3:#6e7681;
  --border:#30363d;--border2:#484f58;
  --accent:#58a6ff;--accent-h:#79c0ff;--accent-bg:rgba(88,166,255,.1);
  --green:#3fb950;--green-bg:rgba(63,185,80,.1);
  --red:#f85149;--red-bg:rgba(248,81,73,.1);
  --orange:#d29922;--orange-bg:rgba(210,153,34,.1);
  --purple:#bc8cff;--purple-bg:rgba(188,140,255,.1);
  --star:#f0b429;--star-bg:rgba(240,180,41,.15);
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 4px 12px rgba(0,0,0,.4);
  --fs-xs:14px;--fs-sm:16px;--fs-base:20px;--fs-md:22px;--fs-lg:26px;--fs-xl:30px;
  --lh-base:1.8;--radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans CN","WenQuanYi Micro Hei",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:24px;font-size:var(--fs-base);line-height:var(--lh-base);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}

.nav-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.nav-brand{color:var(--accent);font-size:var(--fs-lg);font-weight:700;letter-spacing:-.3px;white-space:nowrap;display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.nav-brand:hover{color:var(--accent-h)}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-link{color:var(--text2);text-decoration:none;padding:10px 20px;border-radius:var(--radius);font-size:var(--fs-sm);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav-link:hover{background:var(--bg-hover);color:var(--text)}
.nav-link.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green-bg)}
.status-dot.error{background:var(--red);box-shadow:0 0 6px var(--red-bg)}
.status-text{font-size:var(--fs-sm);color:var(--text2);white-space:nowrap}
.nav-clock{font-size:var(--fs-sm);color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;padding:0 8px;border-left:1px solid var(--border);margin-left:4px}
.theme-toggle{background:var(--bg-card-alt);color:var(--text2);border:1px solid var(--border);width:44px;height:44px;border-radius:var(--radius);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}

.toolbar{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.toolbar-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.toolbar-row:last-child{margin-bottom:0}
.search-box{position:relative;display:flex;align-items:center;flex:1;min-width:280px}
.search-box input{
  background:var(--bg-card-alt);color:var(--text);border:1px solid var(--border);
  padding:12px 44px;border-radius:var(--radius);font-size:var(--fs-sm);font-family:inherit;width:100%;outline:none;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search-box .ico{position:absolute;left:14px;color:var(--text3);font-size:var(--fs-md);pointer-events:none}
.search-clear{position:absolute;right:12px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;width:32px;height:32px;border-radius:50%;display:none;align-items:center;justify-content:center;line-height:1}
.search-clear:hover{background:var(--bg-hover);color:var(--text)}
.search-clear.show{display:flex}

.btn{background:var(--bg-card-alt);color:var(--text2);border:1px solid var(--border);padding:12px 20px;border-radius:var(--radius);cursor:pointer;font-size:var(--fs-sm);font-family:inherit;white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-hover)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{opacity:.9;color:#fff}
.btn-export{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.btn-export:hover{background:var(--green);color:#fff}
.btn-icon{width:44px;height:44px;padding:0;justify-content:center}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.loading-indicator{text-align:center;padding:24px 0;color:var(--text3);font-size:var(--fs-sm)}
.loading-indicator .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.end-indicator{text-align:center;padding:24px 0;color:var(--text3);font-size:var(--fs-sm)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .label{color:var(--text2);font-size:var(--fs-sm);font-weight:600;margin-right:4px}
.filter-chip{background:var(--bg-card);color:var(--text2);border:1px solid var(--border);padding:8px 20px;border-radius:24px;cursor:pointer;font-size:var(--fs-sm);outline:none;font-family:inherit;font-weight:500}
.filter-chip:hover{border-color:var(--accent);color:var(--accent)}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px var(--accent-bg)}
.filter-chip.sent-positive.active{background:var(--green);border-color:var(--green);box-shadow:0 2px 8px var(--green-bg)}
.filter-chip.sent-negative.active{background:var(--red);border-color:var(--red);box-shadow:0 2px 8px var(--red-bg)}

.content-grid{display:grid;grid-template-columns:1fr 360px;gap:20px}

.main-content{min-width:0}

table{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
thead th{background:var(--bg-card-alt);color:var(--text);padding:18px 20px;text-align:left;position:sticky;top:0;border-bottom:2px solid var(--border);font-weight:600;font-size:var(--fs-sm);z-index:1;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg-hover)}
tbody tr.unread{font-weight:500}
tbody tr.unread td:first-child{border-left:3px solid var(--accent)}
tbody td{padding:18px 20px;vertical-align:middle}

.col-fav{width:52px;padding:0 !important;text-align:center}
.fav-btn{background:none;border:none;cursor:pointer;font-size:24px;color:var(--text3);padding:8px;border-radius:var(--radius);line-height:1;transition:transform .1s,color .15s}
.fav-btn:hover{color:var(--star);background:var(--star-bg);transform:scale(1.1)}
.fav-btn.active{color:var(--star)}

.col-imp{width:80px;padding:0 !important;text-align:center}
.imp-badge{display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border-radius:var(--radius);font-size:var(--fs-xs);font-weight:600;color:#fff;white-space:nowrap;line-height:1.4}
.imp-vh{background:var(--red);box-shadow:0 2px 8px var(--red-bg)}
.imp-h{background:var(--orange);box-shadow:0 2px 8px var(--orange-bg)}
.imp-m{background:var(--accent);box-shadow:0 2px 8px var(--accent-bg)}
.imp-l{background:var(--text3);opacity:.7}

.col-time{color:var(--text3);width:180px;white-space:nowrap;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.col-source{width:130px;font-size:var(--fs-sm);min-width:130px}
.src-tag{padding:6px 14px;border-radius:16px;font-size:var(--fs-xs);font-weight:600;display:inline-block;white-space:nowrap;border:1px solid;cursor:pointer}
.src-tag:hover{opacity:.8}
.col-title{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;position:relative}
.col-title a{color:var(--text);text-decoration:none;font-weight:500}
.col-title a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.col-title mark{background:var(--orange-bg);color:var(--orange);padding:0 4px;border-radius:2px;font-weight:600}
.sent-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px;vertical-align:middle;flex-shrink:0}
.sent-pos{background:var(--green);box-shadow:0 0 8px var(--green-bg)}
.sent-neg{background:var(--red);box-shadow:0 0 8px var(--red-bg)}
.sent-neu{background:var(--text3)}

.sidebar{display:flex;flex-direction:column;gap:20px}
.side-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:22px;box-shadow:var(--shadow)}
.side-card h3{font-size:var(--fs-sm);font-weight:600;color:var(--text);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.chart-box{width:100%;height:260px}

.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.empty .ico{font-size:72px;margin-bottom:16px;opacity:.4}
.empty .title{font-size:var(--fs-md);font-weight:500;color:var(--text2);margin-bottom:10px}
.empty .desc{font-size:var(--fs-sm);color:var(--text3);margin-bottom:16px}

.toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;min-width:340px;max-width:460px;pointer-events:auto;border-left:4px solid var(--accent)}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.new{border-left-color:var(--orange)}
.toast .toast-icon{font-size:var(--fs-lg);flex-shrink:0}
.toast .toast-content{flex:1}
.toast .toast-title{font-size:var(--fs-sm);font-weight:600;color:var(--text);margin-bottom:4px}
.toast .toast-msg{font-size:var(--fs-xs);color:var(--text2);line-height:1.6}
.toast .toast-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;opacity:.6;line-height:1}
.toast .toast-close:hover{opacity:1}
.toast-out{opacity:0;pointer-events:none}

.new-badge{background:var(--red);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

@media(max-width:1200px){
  .content-grid{grid-template-columns:1fr}
  .sidebar{display:grid;grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  body{padding:12px}
  .nav-inner{flex-direction:column;align-items:stretch}
  .nav-links{justify-content:center}
  .nav-clock{display:none}
  .toolbar-row{flex-direction:column;align-items:stretch}
  .search-box{min-width:auto}
  .sidebar{grid-template-columns:1fr}
  .col-time{width:130px;font-size:var(--fs-xs)}
  .col-source{width:100px}
}
</style>
</head>
<body>

<div class="nav-bar">
  <div class="nav-inner">
    <a href="/" class="nav-brand">📰 FinFeed</a>
    <nav class="nav-links">
      <a href="/" class="nav-link active" id="nav-news">📰 财经新闻</a>
      <a href="/sentiment" class="nav-link" id="nav-sentiment">💬 舆情监控</a>
      <a href="/favorites" class="nav-link" id="nav-favorites">⭐ 我的收藏</a>
      <a href="/dashboard" class="nav-link" id="nav-dashboard">📊 数据大屏</a>
    </nav>
    <div class="nav-right">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">连接中...</span>
      <span class="nav-clock" id="navClock">--:--:--</span>
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="toolbar-row">
    <div class="search-box">
      <span class="ico">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索新闻标题、内容..." autocomplete="off">
      <button class="search-clear" id="searchClear">✕</button>
    </div>
    <button class="btn btn-export" onclick="exportData('json')">📥 导出</button>
  </div>
  <div class="toolbar-row">
    <div class="filters">
      <span class="label">时间:</span>
      <button class="filter-chip active" data-date="all" onclick="setDateRange('all',this)">全部</button>
      <button class="filter-chip" data-date="today" onclick="setDateRange('today',this)">今天</button>
      <button class="filter-chip" data-date="yesterday" onclick="setDateRange('yesterday',this)">昨天</button>
      <button class="filter-chip" data-date="3days" onclick="setDateRange('3days',this)">近3天</button>
      <button class="filter-chip" data-date="7days" onclick="setDateRange('7days',this)">近7天</button>
    </div>
  </div>
  <div class="toolbar-row">
    <div class="filters" id="sourceFilters"></div>
  </div>
  <div class="toolbar-row">
    <div class="filters">
      <span class="label">情绪:</span>
      <button class="filter-chip active" data-sent="all" onclick="setSentiment('all',this)">全部</button>
      <button class="filter-chip sent-positive" data-sent="positive" onclick="setSentiment('positive',this)">😊 正面</button>
      <button class="filter-chip" data-sent="neutral" onclick="setSentiment('neutral',this)">😐 中性</button>
      <button class="filter-chip sent-negative" data-sent="negative" onclick="setSentiment('negative',this)">😟 负面</button>
    </div>
    <div class="filters" style="margin-left:24px">
      <span class="label">重要性:</span>
      <button class="filter-chip active" data-imp="0" onclick="setImportance(0,this)">全部</button>
      <button class="filter-chip" data-imp="6.0" onclick="setImportance(6.0,this)">重要+</button>
      <button class="filter-chip" data-imp="8.0" onclick="setImportance(8.0,this)">极重要</button>
    </div>
  </div>
</div>

<div class="content-grid">
  <div class="main-content">
    <table>
      <thead>
        <tr>
          <th class="col-fav"></th>
          <th class="col-imp">重要性</th>
          <th class="col-time">时间</th>
          <th class="col-source">来源</th>
          <th>标题</th>
        </tr>
      </thead>
      <tbody id="newsBody">
        <tr><td colspan="5" style="text-align:center;padding:60px;color:var(--text3)">
          <div class="empty"><div class="ico">⏳</div><div class="title">加载中...</div></div>
        </td></tr>
      </tbody>
    </table>
    <div id="loadIndicator" class="loading-indicator" style="display:none">
      <span class="spinner"></span>加载更多...
    </div>
    <div id="endIndicator" class="end-indicator" style="display:none">
      — 已经到底啦 —
    </div>
  </div>
  <div class="sidebar">
    <div class="side-card">
      <h3>📈 24小时趋势</h3>
      <div class="chart-box" id="trendChart"></div>
    </div>
    <div class="side-card">
      <h3>📊 来源分布</h3>
      <div class="chart-box" id="sourceChart"></div>
    </div>
    <div class="side-card">
      <h3>😊 情绪分布</h3>
      <div class="chart-box" id="sentChart"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const PAGE_SIZE = 50;
let state = {
  offset: 0,
  source: 'all',
  keyword: '',
  sentiment: 'all',
  minImportance: 0,
  dateRange: 'all',
  startDate: '',
  endDate: '',
  stockFilter: '',
  total: 0,
  sources: [],
  news: [],
  newsIdMap: new Map(),
  charts: {},
  sse: null,
  lastServerTs: 0,
  loading: false,
  hasMore: true,
};
let abortController = null;
let loadTimer = null;
let chartUpdateTimer = null;

const srcColorMap = {};
function hashColor(str){
  let h=0;
  for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}
  const hue=Math.abs(h)%360;
  return `hsl(${hue},60%,45%)`;
}
function getSrcColor(name){
  if(!srcColorMap[name]) srcColorMap[name]=hashColor(name);
  return srcColorMap[name];
}

function getTheme(){
  try{return document.documentElement.getAttribute('data-theme')||'light';}catch(e){return 'light';}
}
function getThemeColors(){
  const t=getTheme();
  if(t==='dark'){
    return{axis:'#6e7681',split:'rgba(88,166,255,.08)',bar1:'#58a6ff',bar2:'#1d4ed8',line:'#3fb950',area1:'rgba(63,185,80,.25)',area2:'rgba(63,185,80,0)',pos:'#3fb950',neg:'#f85149',neu:'#d29922',pie:['#58a6ff','#3fb950','#d29922','#bc8cff','#9333ea','#66ffcc','#ff9966','#6699ff']};
  }
  return{axis:'#7a8298',split:'rgba(37,99,235,.08)',bar1:'#2563eb',bar2:'#1d4ed8',line:'#16a34a',area1:'rgba(22,163,74,.25)',area2:'rgba(22,163,74,0)',pos:'#16a34a',neg:'#dc2626',neu:'#ea580c',pie:['#2563eb','#16a34a','#ea580c','#db2777','#9333ea','#0891b2','#f97316','#3b82f6']};
}

function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const btn=document.getElementById('themeBtn');
  btn.textContent=t==='dark'?'☀️':'🌙';
  btn.title=t==='dark'?'切换亮色':'切换暗色';
  try{localStorage.setItem('finfeed_theme',t);}catch(e){}
  Object.values(state.charts).forEach(c=>{if(c)c.dispose();});
  initCharts();
  if(state.stats) updateCharts(state.stats);
}
function toggleTheme(){setTheme(getTheme()==='dark'?'light':'dark');}
try{const s=localStorage.getItem('finfeed_theme');if(s)setTheme(s);}catch(e){}

function escHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function highlight(text,kw){
  if(!kw||!text)return escHtml(text);
  try{
    const re=new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
    return escHtml(text).replace(re,'<mark>$1</mark>');
  }catch(e){return escHtml(text);}
}

function fmtTime(ts){
  if(!ts)return'-';
  const d=new Date(ts*1000);
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function updateClock(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const str=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const el=document.getElementById('navClock');
  if(el)el.textContent=str;
}
setInterval(updateClock,1000);
updateClock();

function impBadge(imp){
  if(imp>=8.0)return`<span class="imp-badge imp-vh">极重要</span>`;
  if(imp>=6.5)return`<span class="imp-badge imp-h">重要</span>`;
  if(imp>=5.0)return`<span class="imp-badge imp-m">一般</span>`;
  if(imp>=3.0)return`<span class="imp-badge imp-l">较低</span>`;
  return'';
}

function sentDot(s){
  if(s==='positive')return'<span class="sent-dot sent-pos"></span>';
  if(s==='negative')return'<span class="sent-dot sent-neg"></span>';
  return'';
}

function toast(msg,type='info',title=''){
  const c=document.getElementById('toastContainer');
  const icons={success:'✅',error:'❌',info:'ℹ️',new:'🆕'};
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span class="toast-icon">${icons[type]||'ℹ️'}</span><div class="toast-content">${title?`<div class="toast-title">${title}</div>`:''}<div class="toast-msg">${msg}</div></div><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(el);
  setTimeout(()=>{el.classList.add('toast-out');setTimeout(()=>el.remove(),300);},type==='new'?6000:4000);
}

async function apiToggleFavorite(id,btn){
  try{
    const resp=await fetch('/api/favorite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const data=await resp.json();
    if(data.success){
      const news=state.news.find(n=>n.id===id);
      if(news)news.is_favorite=data.is_favorite;
      btn.classList.toggle('active',data.is_favorite);
      btn.textContent=data.is_favorite?'★':'☆';
    }
  }catch(e){toast('操作失败','error');}
}

async function apiMarkRead(id){
  try{await fetch('/api/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,read:true})});}catch(e){}
}

function getDateRangeParams(range){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  switch(range){
    case 'today':return{start:fmt(now),end:fmt(now)};
    case 'yesterday':{const y=new Date(now);y.setDate(y.getDate()-1);return{start:fmt(y),end:fmt(y)};}
    case '3days':{const s=new Date(now);s.setDate(s.getDate()-2);return{start:fmt(s),end:fmt(now)};}
    case '7days':{const s=new Date(now);s.setDate(s.getDate()-6);return{start:fmt(s),end:fmt(now)};}
    default:return{start:'',end:''};
  }
}

function rebuildNewsIdMap(){
  state.newsIdMap.clear();
  for(const item of state.news){
    state.newsIdMap.set(item.id, item);
  }
}

async function loadNews(reset=false){
  if(reset){
    if(abortController){abortController.abort();}
    abortController = new AbortController();
    if(loadTimer){clearTimeout(loadTimer);loadTimer=null;}
    state.offset=0;
    state.news=[];
    state.newsIdMap.clear();
    state.hasMore=true;
    document.getElementById('endIndicator').style.display='none';
  }
  if(state.loading||!state.hasMore)return;

  state.loading=true;
  const loadIndicator=document.getElementById('loadIndicator');
  loadIndicator.style.display='block';

  try{
    const params=new URLSearchParams();
    params.set('offset',state.offset);
    params.set('limit',PAGE_SIZE);
    if(state.source!=='all')params.set('source',state.source);
    if(state.keyword)params.set('keyword',state.keyword);
    if(state.sentiment!=='all')params.set('sentiment',state.sentiment);
    if(state.minImportance>0)params.set('min_importance',state.minImportance);
    if(state.startDate)params.set('start',state.startDate);
    if(state.endDate)params.set('end',state.endDate);
    if(state.stockFilter)params.set('stock',state.stockFilter);

    const resp=await fetch(`/api/news?${params}`,{signal:abortController?abortController.signal:undefined,cache:'no-store'});
    const data=await resp.json();
    if(!data||data.error)throw new Error(data.error||'加载失败');
    const newItems=data.news||[];
    state.total=data.total||0;
    state.sources=data.sources||[];
    state.stats=data.stats||{};

    if(reset){
      state.news=newItems;
    }else{
      state.news=[...state.news,...newItems];
    }
    rebuildNewsIdMap();

    state.hasMore=!!data.has_more;
    if(data.next_offset!==undefined&&data.next_offset!==null){
      state.offset=data.next_offset;
    }else{
      state.offset+=newItems.length;
    }

    renderNews(reset);
    if(reset){
      renderSourceFilters();
      scheduleChartUpdate(state.stats);
    }
    state.lastServerTs=data.server_ts||Date.now()/1000;

    loadIndicator.style.display='none';
    if(!state.hasMore){
      document.getElementById('endIndicator').style.display='block';
    }else if(!reset){
      loadTimer=setTimeout(checkAndLoadMore, 100);
    }
  }catch(e){
    if(e.name==='AbortError')return;
    console.error('加载失败:',e);
    loadIndicator.style.display='none';
    if(reset){
      document.getElementById('newsBody').innerHTML=`<tr><td colspan="5" style="text-align:center;padding:60px"><div class="empty"><div class="ico">⚠️</div><div class="title">加载失败</div><div class="desc">${e.message}</div><button class="btn btn-primary" onclick="loadNews(true)">重试</button></div></td></tr>`;
    }
  }finally{
    state.loading=false;
  }
}

function scheduleChartUpdate(stats){
  if(chartUpdateTimer)clearTimeout(chartUpdateTimer);
  chartUpdateTimer=setTimeout(()=>updateCharts(stats), 100);
}

function renderSourceFilters(){
  const el=document.getElementById('sourceFilters');
  if(!el)return;
  let html='<span class="label">来源:</span><button class="filter-chip '+(state.source==='all'?'active':'')+'" onclick="setSource(\'all\',this)">全部</button>';
  state.sources.forEach(s=>{
    const active=state.source===s?'active':'';
    html+=`<button class="filter-chip ${active}" onclick="setSource('${s.replace(/'/g,"\\'")}',this)">${s}</button>`;
  });
  el.innerHTML=html;
}

function renderNewsItem(item){
  const color=getSrcColor(item.source);
  const isNew=item.publish_ts && item.publish_ts>state.lastServerTs-300;
  const tr=document.createElement('tr');
  tr.className=item.is_read?'':'unread';
  tr.dataset.id=String(item.id);
  tr.innerHTML=`
    <td class="col-fav"><button class="fav-btn ${item.is_favorite?'active':''}" onclick="apiToggleFavorite(${item.id},this)" title="${item.is_favorite?'取消收藏':'收藏'}">${item.is_favorite?'★':'☆'}</button></td>
    <td class="col-imp">${impBadge(item.importance)}</td>
    <td class="col-time">${fmtTime(item.publish_ts)}</td>
    <td class="col-source"><span class="src-tag" style="color:${color};background:${color}15;border-color:${color}40" onclick="setSource('${(item.source||'').replace(/'/g,"\\'")}')">${escHtml(item.source)}</span></td>
    <td class="col-title">${sentDot(item.sentiment)}<a href="${escHtml(item.url)}" target="_blank" rel="noopener" onclick="apiMarkRead(${item.id})">${highlight(item.title,state.keyword)}${isNew?'<span class="new-badge">NEW</span>':''}</a></td>
  `;
  return tr;
}

function prependNewsItems(items){
  if(!items.length)return;
  const tbody=document.getElementById('newsBody');
  if(!tbody)return;
  const emptyRow=tbody.querySelector('tr td[colspan]');
  if(emptyRow)tbody.innerHTML='';
  const frag=document.createDocumentFragment();
  for(let i=items.length-1;i>=0;i--){
    const item=items[i];
    if(!state.newsIdMap.has(item.id)){
      state.news.unshift(item);
      state.newsIdMap.set(item.id,item);
      frag.insertBefore(renderNewsItem(item),frag.firstChild);
    }
  }
  if(frag.firstChild){
    tbody.insertBefore(frag,tbody.firstChild);
  }
  state.total+=items.length;
}

function renderNews(reset=false){
  const tbody=document.getElementById('newsBody');
  if(!state.news.length){
    tbody.innerHTML=`<tr><td colspan="5" style="text-align:center;padding:80px"><div class="empty"><div class="ico">📭</div><div class="title">暂无新闻</div><div class="desc">试试调整筛选条件或等待新数据</div></div></td></tr>`;
    return;
  }

  if(reset){
    tbody.innerHTML='';
    const frag=document.createDocumentFragment();
    for(const item of state.news){
      frag.appendChild(renderNewsItem(item));
    }
    tbody.appendChild(frag);
    window.scrollTo({top:0,behavior:'instant'});
  }else{
    const existingIds=new Set();
    tbody.querySelectorAll('tr[data-id]').forEach(tr=>existingIds.add(Number(tr.dataset.id)));
    const newItems=state.news.filter(n=>!existingIds.has(n.id));
    if(newItems.length){
      const frag=document.createDocumentFragment();
      for(const item of newItems){
        frag.appendChild(renderNewsItem(item));
      }
      tbody.appendChild(frag);
    }
  }
}

function setSource(s,btn){
  state.source=s;
  document.querySelectorAll('.filters .filter-chip').forEach(b=>{
    if(b.dataset.sent||b.dataset.imp||b.dataset.date)return;
    b.classList.remove('active');
  });
  if(btn){btn.classList.add('active');}
  else{
    document.querySelectorAll('.filter-chip').forEach(b=>{
      if(b.textContent===s)b.classList.add('active');
    });
  }
  loadNews(true);
}
function setSentiment(s,btn){
  state.sentiment=s;
  document.querySelectorAll('.filter-chip[data-sent]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadNews(true);
}
function setImportance(v,btn){
  state.minImportance=parseFloat(v);
  document.querySelectorAll('.filter-chip[data-imp]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadNews(true);
}
function setDateRange(range,btn){
  state.dateRange=range;
  const dr=getDateRangeParams(range);
  state.startDate=dr.start;
  state.endDate=dr.end;
  document.querySelectorAll('.filter-chip[data-date]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadNews(true);
}
function exportData(fmt){
  const params=new URLSearchParams();
  params.set('format',fmt);
  if(state.startDate)params.set('start',state.startDate);
  if(state.endDate)params.set('end',state.endDate);
  window.location.href=`/api/export?${params}`;
}

function checkAndLoadMore(){
  if(state.loading||!state.hasMore)return;
  const scrollTop=window.scrollY||document.documentElement.scrollTop;
  const windowHeight=window.innerHeight;
  const docHeight=document.documentElement.scrollHeight;
  if(docHeight<=windowHeight||scrollTop+windowHeight>=docHeight-300){
    loadNews(false);
  }
}

function initCharts(){
  const c=getThemeColors();
  const trendEl=document.getElementById('trendChart');
  const srcEl=document.getElementById('sourceChart');
  const sentEl=document.getElementById('sentChart');
  if(trendEl)state.charts.trend=echarts.init(trendEl);
  if(srcEl)state.charts.source=echarts.init(srcEl);
  if(sentEl)state.charts.sent=echarts.init(sentEl);
  window.addEventListener('resize',()=>Object.values(state.charts).forEach(ch=>ch&&ch.resize()));
}

function updateCharts(stats){
  if(!stats)return;
  const c=getThemeColors();
  if(state.charts.trend&&stats.time_trend){
    state.charts.trend.setOption({
      tooltip:{trigger:'axis'},
      grid:{left:'3%',right:'4%',bottom:'3%',top:'10%',containLabel:true},
      xAxis:{type:'category',data:stats.time_trend.map(d=>d.time),axisLabel:{color:c.axis,fontSize:11}},
      yAxis:{type:'value',axisLabel:{color:c.axis},splitLine:{lineStyle:{color:c.split}}},
      series:[{type:'line',data:stats.time_trend.map(d=>d.count),smooth:true,lineStyle:{color:c.line,width:2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:c.area1},{offset:1,color:c.area2}])},itemStyle:{color:c.line}}]
    });
  }
  if(state.charts.source&&stats.source_stats){
    const srcData=Object.entries(stats.source_stats).sort((a,b)=>b[1]-a[1]).slice(0,8);
    state.charts.source.setOption({
      tooltip:{trigger:'item'},
      legend:{type:'scroll',bottom:0,textStyle:{color:c.axis,fontSize:11}},
      series:[{type:'pie',radius:['35%','60%'],center:['50%','42%'],data:srcData.map(([n,v])=>({name:n,value:v})),label:{show:false},color:c.pie}]
    });
  }
  if(state.charts.sent&&stats.sentiment_stats){
    state.charts.sent.setOption({
      tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
      legend:{bottom:0,textStyle:{color:c.axis}},
      series:[{type:'pie',radius:['40%','65%'],center:['50%','42%'],avoidLabelOverlap:false,label:{show:false},emphasis:{label:{show:true,fontSize:16,fontWeight:'bold'}},data:[
        {name:'正面',value:stats.sentiment_stats.positive||0,itemStyle:{color:c.pos}},
        {name:'中性',value:stats.sentiment_stats.neutral||0,itemStyle:{color:c.neu}},
        {name:'负面',value:stats.sentiment_stats.negative||0,itemStyle:{color:c.neg}}
      ]}]
    });
  }
}

function isDefaultFilter(){
  return state.offset===0&&!state.keyword&&state.source==='all'&&state.sentiment==='all'&&state.minImportance===0&&state.dateRange==='all'&&!state.stockFilter;
}

function connectSSE(){
  if(state.sse)return;
  try{
    state.sse=new EventSource('/api/events');
    state.sse.addEventListener('connected',()=>{
      document.getElementById('statusDot').className='status-dot';
      document.getElementById('statusText').textContent='实时连接';
    });
    state.sse.addEventListener('news',(e)=>{
      try{
        const d=JSON.parse(e.data);
        if(d.type==='new_news'&&d.category==='finance'&&d.items&&d.items.length){
          toast(`收到 ${d.count} 条新闻`,'new','新消息');
          if(isDefaultFilter()){
            prependNewsItems(d.items);
          }else if(state.offset===0){
            loadNews(true);
          }
        }
      }catch(err){}
    });
    state.sse.onerror=()=>{
      document.getElementById('statusDot').className='status-dot error';
      document.getElementById('statusText').textContent='重连中...';
      state.sse=null;
      setTimeout(connectSSE,5000);
    };
  }catch(e){
    document.getElementById('statusDot').className='status-dot error';
    document.getElementById('statusText').textContent='轮询模式';
    setInterval(()=>{if(state.offset===0)loadNews(true);},30000);
  }
}

const searchInput=document.getElementById('searchInput');
const searchClear=document.getElementById('searchClear');
let searchTimer;
searchInput.addEventListener('input',()=>{
  searchClear.classList.toggle('show',!!searchInput.value);
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{state.keyword=searchInput.value.trim();loadNews(true);},300);
});
searchClear.addEventListener('click',()=>{searchInput.value='';state.keyword='';searchClear.classList.remove('show');loadNews(true);searchInput.focus();});

let scrollTicking=false;
function handleScroll(){
  if(!scrollTicking){
    scrollTicking=true;
    requestAnimationFrame(()=>{
      checkAndLoadMore();
      scrollTicking=false;
    });
  }
}
window.addEventListener('scroll',handleScroll,{passive:true});

initCharts();
loadNews(true);
connectSSE();
</script>
</body>
</html>
