<!-- 财经日历模块片段（由 index.html 懒加载注入 #view-calendar） -->
<style>
#calRoot{--cal-up:#e34d59;--cal-down:#2ba471;--cal-mid:#e6a23c;--cal-low:#9aa0a6;
  font-size:14px;color:var(--text);padding:0;max-width:1800px;margin:0 auto}
#calRoot *{box-sizing:border-box}
#calRoot .cal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px}
#calRoot .cal-h{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#calRoot .cal-title{font-size:var(--fs-lg);font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px}
#calRoot .cal-sub{color:var(--text3);font-size:var(--fs-sm);margin-top:2px}
#calRoot .cal-stats{display:flex;gap:18px;flex-wrap:wrap}
#calRoot .cal-stat{text-align:right}
#calRoot .cal-stat .n{font-size:var(--fs-lg);font-weight:700;font-variant-numeric:tabular-nums}
#calRoot .cal-stat .l{font-size:var(--fs-xs);color:var(--text3)}
#calRoot .cal-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
#calRoot .cal-tab{padding:9px 18px;border-radius:var(--radius);cursor:pointer;user-select:none;
  color:var(--text2);font-weight:500;background:var(--bg-card);border:1px solid var(--border);white-space:nowrap}
#calRoot .cal-tab:hover{background:var(--bg-hover);color:var(--text)}
#calRoot .cal-tab.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:600}
#calRoot .cal-toolbar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
#calRoot .cal-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#calRoot .cal-seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
#calRoot .cal-seg button{border:0;background:var(--bg-card);color:var(--text2);padding:7px 12px;cursor:pointer;
  font-size:var(--fs-sm);border-right:1px solid var(--border)}
#calRoot .cal-seg button:last-child{border-right:0}
#calRoot .cal-seg button:hover{background:var(--bg-hover);color:var(--text)}
#calRoot .cal-seg button.active{background:var(--accent);color:#fff}
#calRoot .cal-seg button.on-accent{background:var(--accent-bg);color:var(--accent)}
#calRoot select,#calRoot input[type=text],#calRoot input[type=date]{background:var(--bg-card);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:var(--fs-sm);outline:none}
#calRoot select:focus,#calRoot input:focus{border-color:var(--accent)}
#calRoot .cal-btn{border:1px solid var(--border);background:var(--bg-card);color:var(--text);border-radius:var(--radius);
  padding:7px 14px;cursor:pointer;font-size:var(--fs-sm);white-space:nowrap}
#calRoot .cal-btn:hover{background:var(--bg-hover);color:var(--text)}
#calRoot .cal-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#calRoot .cal-btn.primary:hover{background:var(--accent-h)}
#calRoot .cal-spacer{flex:1 1 auto}
#calRoot .cal-status{font-size:var(--fs-sm);color:var(--text3);min-height:18px}
#calRoot .cal-status .ok{color:var(--cal-down)}
#calRoot .cal-status .warn{color:var(--cal-mid)}
#calRoot .cal-status .err{color:var(--cal-up)}
#calRoot table.cal-tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg-card);
  border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
#calRoot table.cal-tbl th{text-align:left;padding:11px 12px;font-size:var(--fs-xs);color:var(--text3);
  background:var(--bg-hover);border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap;position:sticky;top:0}
#calRoot table.cal-tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:var(--fs-sm)}
#calRoot table.cal-tbl tr:last-child td{border-bottom:0}
#calRoot table.cal-tbl tbody tr:hover{background:var(--bg-hover)}
#calRoot .cal-date{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600;white-space:nowrap}
#calRoot .cal-time{color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
#calRoot .cal-imp{font-weight:700;letter-spacing:1px}
#calRoot .cal-imp-3{color:var(--cal-up)}#calRoot .cal-imp-2{color:var(--cal-mid)}#calRoot .cal-imp-1{color:var(--cal-low)}
#calRoot .cal-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:var(--fs-xs);
  background:var(--accent-bg);color:var(--accent);white-space:nowrap;margin:1px 2px 1px 0}
#calRoot .cal-tag.region{background:rgba(45,140,240,.12);color:#2d8cf0}
#calRoot .cal-titlecell{font-weight:600;color:var(--text);line-height:1.4}
#calRoot .cal-code{font-variant-numeric:tabular-nums;color:var(--text2);font-size:var(--fs-xs)}
#calRoot .cal-link{color:var(--accent);text-decoration:none;font-size:var(--fs-xs)}
#calRoot .cal-link:hover{text-decoration:underline}
#calRoot .cal-val{font-variant-numeric:tabular-nums;white-space:nowrap}
#calRoot .cal-val.up{color:var(--cal-up);font-weight:600}
#calRoot .cal-val.down{color:var(--cal-down);font-weight:600}
#calRoot .cal-val.dim{color:var(--text3)}
#calRoot .cal-empty{padding:70px 20px;text-align:center;color:var(--text3)}
#calRoot .cal-empty .ico{font-size:34px;margin-bottom:8px}
#calRoot .cal-loading{padding:60px;text-align:center;color:var(--text3)}
/* 月历 */
#calRoot .cal-month-h{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
#calRoot .cal-month-h .m{font-size:var(--fs-lg);font-weight:700;min-width:120px;text-align:center}
#calRoot .cal-month-h button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text);cursor:pointer;font-size:16px}
#calRoot .cal-month-h button:hover{background:var(--bg-hover)}
#calRoot .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#calRoot .cal-grid .wd{text-align:center;font-size:var(--fs-xs);color:var(--text3);padding:4px 0;font-weight:600}
#calRoot .cal-cell{min-height:78px;border:1px solid var(--border);border-radius:10px;padding:6px 8px;
  background:var(--bg-card);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:.12s}
#calRoot .cal-cell:hover{border-color:var(--accent);background:var(--bg-hover)}
#calRoot .cal-cell.out{opacity:.38}
#calRoot .cal-cell .d{font-weight:600;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
#calRoot .cal-cell .cnt{font-size:var(--fs-xs);color:var(--text2)}
#calRoot .cal-cell .hi{color:var(--cal-up);font-weight:700}
#calRoot .cal-cell .pill{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
#calRoot .cal-cell .p-fin{background:#2d8cf0}#calRoot .cal-cell .p-stk{background:#9c6ade}
#calRoot .cal-cell .p-ipo{background:#e6a23c}#calRoot .cal-cell .p-glo{background:#2ba471}
#calRoot .cal-multiday{font-size:10px;color:var(--accent);font-weight:700}
@media(max-width:900px){#calRoot .cal-grid{grid-template-columns:repeat(7,1fr)}#calRoot .cal-cell{min-height:58px}}
</style>

<div id="calRoot">
  <div class="cal-card">
    <div class="cal-h">
      <div>
        <div class="cal-title">📅 东方财富财经日历</div>
        <div class="cal-sub" id="calSub">整合财经日历 · 股市日历 · 新股申购 · 全球经济</div>
      </div>
      <div class="cal-stats" id="calStats"></div>
    </div>
  </div>

  <div class="cal-card">
    <div class="cal-tabs" id="calTabs"></div>
    <div class="cal-toolbar" style="margin-top:4px">
      <div class="cal-group" id="calRangeSeg"></div>
      <div class="cal-group" id="calCustom" style="display:none">
        <input type="date" id="calStart">
        <span style="color:var(--text3)">至</span>
        <input type="date" id="calEnd">
      </div>
      <div class="cal-group">
        <div class="cal-seg" id="calViewSeg">
          <button data-view="list" class="active">列表</button>
          <button data-view="month">月历</button>
        </div>
      </div>
      <div class="cal-spacer"></div>
      <div class="cal-group">
        <button class="cal-btn primary" id="calRefresh">↻ 刷新</button>
        <button class="cal-btn" data-fmt="csv">导出CSV</button>
        <button class="cal-btn" data-fmt="json">JSON</button>
        <button class="cal-btn" data-fmt="md">MD</button>
      </div>
    </div>
    <div class="cal-toolbar" style="margin-top:12px">
      <div class="cal-group">
        <select id="calCat"></select>
      </div>
      <div class="cal-group">
        <select id="calImp">
          <option value="0">全部重要性</option>
          <option value="1">低及以上</option>
          <option value="2">中及以上</option>
          <option value="3">仅高</option>
        </select>
      </div>
      <div class="cal-group">
        <input type="text" id="calQ" placeholder="搜索关键词 / 代码 / 名称" style="width:240px">
      </div>
      <div class="cal-status cal-spacer" id="calStatus"></div>
    </div>
  </div>

  <div class="cal-card">
    <div id="calListView">
      <table class="cal-tbl">
        <thead id="calHead"></thead>
        <tbody id="calBody"></tbody>
      </table>
      <div class="cal-status" id="calListFoot" style="padding-top:10px"></div>
    </div>
    <div id="calMonthView" style="display:none">
      <div class="cal-month-h">
        <button id="calPrevM">‹</button>
        <div class="m" id="calMonthLabel"></div>
        <button id="calNextM">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
</div>

<script>
window.CalendarAPI = (function(){
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,'0');
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}

  const S = {
    types:[], cats:{}, labels:{}, today:'', type:'finance',
    range:'today', start:'', end:'', month:'', view:'list',
    category:'', region:'', q:'', importance:0,
    TODAY:null, items:[], total:0, monthCounts:{}
  };

  const RANGES = [
    ['today','今天'],['tomorrow','明天'],['week','本周'],['month','本月'],
    ['quarter','本季'],['year','今年'],['7d','近7天'],['30d','近30天'],['custom','自定义']
  ];

  function computeRange(key){
    const T = S.TODAY;
    if(key==='today')   return [ymd(T),ymd(T)];
    if(key==='tomorrow'){const x=addDays(T,1);return [ymd(x),ymd(x)];}
    if(key==='7d'){return [ymd(addDays(T,-6)),ymd(T)];}
    if(key==='30d'){return [ymd(addDays(T,-29)),ymd(T)];}
    if(key==='week'){const x=new Date(T);x.setDate(x.getDate()-((x.getDay()+6)%7));return [ymd(x),ymd(addDays(x,6))];}
    if(key==='month'){return [ymd(new Date(T.getFullYear(),T.getMonth(),1)),ymd(new Date(T.getFullYear(),T.getMonth()+1,0))];}
    if(key==='quarter'){const q=Math.floor(T.getMonth()/3)*3;return [ymd(new Date(T.getFullYear(),q,1)),ymd(new Date(T.getFullYear(),q+3,0))];}
    if(key==='year'){return [ymd(new Date(T.getFullYear(),0,1)),ymd(new Date(T.getFullYear(),11,31))];}
    return [S.start,S.end];
  }

  async function apiGet(path, params){
    const u = path + '?' + new URLSearchParams(params).toString();
    const r = await fetch(u, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }

  function renderTabs(){
    const box = $('#calTabs'); box.innerHTML='';
    const all = [{key:'all',label:'全部',desc:'四类整合'}].concat(S.types);
    all.forEach(t=>{
      const el=document.createElement('div');
      el.className='cal-tab'+(t.key===S.type?' active':'');
      el.textContent=t.label;
      el.title=t.desc||'';
      el.onclick=()=>{S.type=t.key;S.category='';S.region='';S.range='today';
        const [a,b]=computeRange('today');S.start=a;S.end=b;renderTabs();renderRangeSeg();renderCatSelect();renderHead();loadList();};
      box.appendChild(el);
    });
  }

  function renderRangeSeg(){
    const box=$('#calRangeSeg'); box.innerHTML='';
    RANGES.forEach(([k,label])=>{
      const b=document.createElement('button');
      b.textContent=label; b.className=(k===S.range?'active':'');
      if(k!=='custom') b.onclick=()=>{S.range=k;const [a,b2]=computeRange(k);S.start=a;S.end=b2;
        $('#calCustom').style.display='none';renderRangeSeg();loadList();};
      else b.onclick=()=>{S.range='custom';$('#calCustom').style.display='inline-flex';renderRangeSeg();};
      box.appendChild(b);
    });
  }

  function renderCatSelect(){
    const sel=$('#calCat'); sel.innerHTML='';
    if(S.type==='all'){sel.style.display='none';return;}
    sel.style.display='inline-block';
    const opts = S.cats[S.type]||[];
    const label = S.type==='global' ? '全部地区' : '全部分类';
    sel.appendChild(new Option(label,''));
    opts.forEach(o=>sel.appendChild(new Option(o,o)));
    if(S.type==='global') sel.value = S.region; else sel.value = S.category;
    sel.onchange=()=>{
      if(S.type==='global'){S.region=sel.value;S.category='';} else {S.category=sel.value;S.region='';}
      loadList();
    };
  }

  function renderHead(){
    const cols = headCols();
    $('#calHead').innerHTML='<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  }
  function headCols(){
    if(S.type==='finance') return ['日期','时间','重要','分类','事件','地点/主办','详情'];
    if(S.type==='stock')   return ['日期','重要','代码','名称','类型','事件'];
    if(S.type==='ipo')     return ['日期','重要','代码','名称','节点','类别'];
    if(S.type==='global')  return ['日期','时间','重要','地区','事件','前值','预期','公布'];
    return ['日期','类型','重要','事件','地区'];
  }

  function rowHtml(it){
    const imp = `<span class="cal-imp cal-imp-${it.importance}">${'★'.repeat(it.importance||0)||'-'}</span>`;
    if(S.type==='finance'){
      const multi = (it.end_date && it.end_date!==it.event_date) ? `<span class="cal-multiday">${esc(it.event_date)}~${esc(it.end_date)}</span>` : esc(it.event_date);
      const time = it.event_time?`<span class="cal-time">${esc(it.event_time)}</span>`:'';
      return `<td><div class="cal-date">${multi}</div>${time}</td><td>${imp}</td>
        <td><span class="cal-tag">${esc(it.category)}</span></td>
        <td class="cal-titlecell">${esc(it.title)}</td>
        <td class="cal-code">${esc(it.region||'')}</td>
        <td class="cal-code">${esc(it.content||'')}</td>`;
    }
    if(S.type==='stock'){
      const link = it.url?`<a class="cal-link" href="${esc(it.url)}" target="_blank">行情↗</a>`:'';
      return `<td><div class="cal-date">${esc(it.event_date)}</div></td><td>${imp}</td>
        <td class="cal-code">${esc(it.code||'')}</td>
        <td class="cal-titlecell">${esc(it.name||'')}</td>
        <td><span class="cal-tag">${esc(it.category)}</span></td>
        <td class="cal-titlecell">${esc(it.title)}${link}</td>`;
    }
    if(S.type==='ipo'){
      const link = it.url?`<a class="cal-link" href="${esc(it.url)}" target="_blank">详情↗</a>`:'';
      return `<td><div class="cal-date">${esc(it.event_date)}</div></td><td>${imp}</td>
        <td class="cal-code">${esc(it.code||'')}</td>
        <td class="cal-titlecell">${esc(it.name||'')}</td>
        <td><span class="cal-tag">${esc(it.category)}</span></td>
        <td class="cal-titlecell">${esc(it.sub_type||'')} ${link}</td>`;
    }
    if(S.type==='global'){
      const pv=it.prev_value, fv=it.forecast_value, av=it.actual_value;
      let avCls='cal-val dim';
      if(av && fv){const a=parseFloat(av.replace(/,/g,'')),f=parseFloat(fv.replace(/,/g,''));
        if(!isNaN(a)&&!isNaN(f)){avCls='cal-val '+(a>f?'up':(a<f?'down':'dim'));}}
      const time = it.event_time?`<span class="cal-time">${esc(it.event_time)}</span>`:'';
      return `<td><div class="cal-date">${esc(it.event_date)}</div>${time}</td>
        <td>${imp}</td>
        <td><span class="cal-tag region">${esc(it.region||'')}</span></td>
        <td class="cal-titlecell">${esc(it.title)}</td>
        <td class="cal-val dim">${esc(pv||'-')}</td>
        <td class="cal-val">${esc(fv||'-')}</td>
        <td class="${avCls}">${esc(av||'-')}</td>`;
    }
    // all
    const tl={finance:'财经',stock:'股市',ipo:'新股',global:'全球'}[it.cal_type]||it.cal_type;
    return `<td><div class="cal-date">${esc(it.event_date)}</div></td>
      <td><span class="cal-tag">${tl}</span></td><td>${imp}</td>
      <td class="cal-titlecell">${esc(it.title)}</td>
      <td class="cal-code">${esc(it.region||'')}</td>`;
  }

  function renderList(data){
    S.items=data.items||[]; S.total=data.total||0;
    const body=$('#calBody');
    if(!S.items.length){
      body.innerHTML=`<tr><td colspan="7"><div class="cal-empty"><div class="ico">📭</div>
        <div>该区间暂无数据</div><div class="cal-sub" style="margin-top:6px">可切换类型 / 调整日期，或点「刷新」强制拉取</div></div></td></tr>`;
    } else {
      body.innerHTML=S.items.map(it=>`<tr>${rowHtml(it)}</tr>`).join('');
    }
    const syn=data.sync||{};
    const syncTxt = syn.cached ? `<span class="ok">● 缓存命中</span>` :
      (syn.fetched?`已同步 <b>${syn.fetched}</b> 条 / ${syn.days} 天`:'');
    const errTxt = syn.errors&&syn.errors.length?`<span class="err">⚠ ${syn.errors.length} 个错误</span>`:'';
    $('#calListFoot').innerHTML=`共 <b>${S.total}</b> 条　${syncTxt} ${errTxt}　<span class="cal-sub">区间 ${esc(data.start)} ~ ${esc(data.end)}</span>`;
  }

  async function loadList(){
    setStatus('loading','加载中…');
    try{
      const p={type:S.type,start:S.start,end:S.end,category:S.category,region:S.region,
        q:S.q,importance:S.importance,limit:5000,sync:1};
      const data=await apiGet('/api/calendar/list',p);
      renderList(data);
      setStatus('ok',`更新于 ${new Date().toLocaleTimeString('zh-CN')}`);
    }catch(e){ setStatus('err','加载失败：'+e.message); }
  }

  async function loadMonth(){
    try{
      const data=await apiGet('/api/calendar/month',{type:S.type,month:S.month});
      S.monthCounts=data.counts||{};
      renderMonth(data);
    }catch(e){ $('#calGrid').innerHTML=`<div class="cal-empty">月历加载失败：${esc(e.message)}</div>`; }
  }

  function renderMonth(data){
    const [y,m]=S.month.split('-').map(Number);
    $('#calMonthLabel').textContent=`${y} 年 ${m} 月`;
    const first=new Date(y,m-1,1);
    const startWd=(first.getDay()+6)%7; // 周一=0
    const daysInMonth=new Date(y,m,0).getDate();
    const grid=$('#calGrid'); grid.innerHTML='';
    ['一','二','三','四','五','六','日'].forEach(w=>{
      const d=document.createElement('div');d.className='wd';d.textContent=w;grid.appendChild(d);});
    const todayStr=S.today;
    for(let i=0;i<startWd;i++){const c=document.createElement('div');c.className='cal-cell out';grid.appendChild(c);}
    for(let d=1;d<=daysInMonth;d++){
      const ds=`${y}-${pad(m)}-${pad(d)}`;
      const c=document.createElement('div');c.className='cal-cell';
      const cnt=S.monthCounts[ds]||{total:0,high:0,finance:0,stock:0,ipo:0,global:0};
      let pills='';
      if(S.type==='all'){
        if(cnt.finance)pills+='<span class="pill p-fin"></span>';
        if(cnt.stock)pills+='<span class="pill p-stk"></span>';
        if(cnt.ipo)pills+='<span class="pill p-ipo"></span>';
        if(cnt.global)pills+='<span class="pill p-glo"></span>';
      }
      c.innerHTML=`<div class="d">${d}${ds===todayStr?' ·':''}</div>
        <div class="cnt">${pills||''}${cnt.total?`<span class="${cnt.high?'hi':''}">${cnt.total} 项</span>`:'<span style="color:var(--text3)">—</span>'}</div>`;
      c.onclick=()=>{S.start=ds;S.end=ds;S.range='custom';$('#calCustom').style.display='inline-flex';
        $('#calStart').value=ds;$('#calEnd').value=ds;switchView('list');};
      grid.appendChild(c);
    }
  }

  function switchView(v){
    S.view=v;
    document.querySelectorAll('#calViewSeg button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
    $('#calListView').style.display = v==='list'?'block':'none';
    $('#calMonthView').style.display = v==='month'?'block':'none';
    if(v==='month'){
      if(!S.month) S.month=S.today.slice(0,7);
      loadMonth();
    } else loadList();
  }

  function setStatus(kind,txt){
    const el=$('#calStatus');
    el.className='cal-status cal-spacer '+(kind==='err'?'err':kind==='ok'?'ok':'warn');
    el.textContent=txt;
  }

  function renderStats(stats){
    const box=$('#calStats');
    const byT=stats.by_type||{};
    box.innerHTML=`
      <div class="cal-stat"><div class="n">${(stats.total||0).toLocaleString()}</div><div class="l">事件总数</div></div>
      <div class="cal-stat"><div class="n">${(byT.finance||0).toLocaleString()}</div><div class="l">财经</div></div>
      <div class="cal-stat"><div class="n">${(byT.stock||0).toLocaleString()}</div><div class="l">股市</div></div>
      <div class="cal-stat"><div class="n">${(byT.ipo||0).toLocaleString()}</div><div class="l">新股</div></div>
      <div class="cal-stat"><div class="n">${(byT.global||0).toLocaleString()}</div><div class="l">全球</div></div>`;
  }

  function exportUrl(fmt){
    const p=new URLSearchParams({type:S.type,start:S.start,end:S.end,category:S.category,
      region:S.region,q:S.q,importance:S.importance,format:fmt});
    return '/api/calendar/export?'+p.toString();
  }

  async function doRefresh(){
    setStatus('loading','强制刷新中…');
    try{
      const r=await fetch('/api/calendar/refresh',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({type:S.type,start:S.start,end:S.end})});
      const j=await r.json();
      if(S.view==='month') loadMonth(); else loadList();
      setStatus(j.ok?'ok':'err', j.ok?'已刷新':'刷新失败');
    }catch(e){ setStatus('err','刷新失败：'+e.message); }
  }

  function bind(){
    $('#calViewSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
    $('#calImp').onchange=e=>{S.importance=parseInt(e.target.value||'0',10);loadList();};
    let qt; $('#calQ').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();loadList();},350);};
    $('#calStart').onchange=e=>{S.start=e.target.value;if(S.range!=='custom')S.range='custom';loadList();};
    $('#calEnd').onchange=e=>{S.end=e.target.value;if(S.range!=='custom')S.range='custom';loadList();};
    $('#calRefresh').onclick=doRefresh;
    document.querySelectorAll('#calRoot [data-fmt]').forEach(b=>b.onclick=()=>{
      const a=document.createElement('a');a.href=exportUrl(b.dataset.fmt);a.download='';document.body.appendChild(a);a.click();a.remove();
    });
    $('#calPrevM').onclick=()=>{const [y,m]=S.month.split('-').map(Number);
      const nm=m===1?12:m-1, ny=m===1?y-1:y;S.month=`${ny}-${pad(nm)}`;loadMonth();};
    $('#calNextM').onclick=()=>{const [y,m]=S.month.split('-').map(Number);
      const nm=m===12?1:m+1, ny=m===12?y+1:y;S.month=`${ny}-${pad(nm)}`;loadMonth();};
  }

  async function init(){
    try{
      const init=await apiGet('/api/calendar/init',{});
      S.types=init.types||[]; S.cats=init.categories||{}; S.labels=init.importance_labels||{};
      S.today=init.today||ymd(new Date()); S.TODAY=parseYmd(S.today);
      renderStats(init.stats||{});
    }catch(e){ setStatus('err','初始化失败：'+e.message); return; }
    const [a,b]=computeRange('today'); S.start=a; S.end=b;
    renderTabs(); renderRangeSeg(); renderCatSelect(); renderHead(); bind();
    loadList();
  }

  return {init};
})();
</script>
