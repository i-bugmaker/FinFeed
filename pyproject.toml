[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finfeed"
version = "2.1.0"
description = "实时金融新闻监控系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FinFeed Team" }]

[project.scripts]
finfeed = "finfeed.cli:main"

[project.urls]
"Homepage" = "https://github.com/finfeed/finfeed"
"Bug Tracker" = "https://github.com/finfeed/finfeed/issues"

[project.dependencies]
httpx = ">=0.28.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=4.9.0"
rich = ">=13.0.0"
playwright = ">=1.40.0"
openpyxl = ">=3.1.0"
# --- 方案 D 新 Web 后端（双轨并行） ---
fastapi = ">=0.110"
uvicorn = ">=0.27"
python-multipart = ">=0.0.9"
pydantic = ">=2.13,<3"
# pydantic-core 需与 pydantic 主版本严格匹配，否则 import fastapi 会报
# `pydantic-core X incompatible with pydantic requiring Y`。当前锁定 2.46.4。
pydantic-core = "==2.46.4"

[tool.setuptools.packages.find]
where = ["finfeed"]

[tool.setuptools.package-data]
"finfeed.ui.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["finfeed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
multi_line_output = 3