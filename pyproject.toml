[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finfeed"
version = "1.0.0"
description = "实时金融新闻监控系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FinFeed Team" }]

[project.scripts]
finfeed = "finfeed.cli:main"

[project.urls]
"Homepage" = "https://github.com/finfeed/finfeed"
"Bug Tracker" = "https://github.com/finfeed/finfeed/issues"

[project.dependencies]
httpx = ">=0.24.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=4.9.0"
aiohttp = ">=3.8.0"
flask = ">=2.3.0"
pandas = ">=2.0.0"
scikit-learn = ">=1.2.0"
scipy = ">=1.10.0"
numpy = ">=1.24.0"
openpyxl = ">=3.1.0"

[tool.setuptools.packages.find]
where = ["finfeed"]

[tool.setuptools.package-data]
"finfeed.ui.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["finfeed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
multi_line_output = 3