[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finfeed"
version = "2.1.0"
description = "实时金融新闻监控系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FinFeed Team" }]

[project.scripts]
finfeed = "finfeed.cli:main"

[project.urls]
"Homepage" = "https://github.com/finfeed/finfeed"
"Bug Tracker" = "https://github.com/finfeed/finfeed/issues"

[project.dependencies]
httpx = ">=0.28.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=4.9.0"
rich = ">=13.0.0"
playwright = ">=1.40.0"
openpyxl = ">=3.1.0"
# --- 方案 D 新 Web 后端（双轨并行） ---
fastapi = ">=0.110"
uvicorn = ">=0.27"
pydantic = ">=2.13,<3"
# pydantic-core 需与 pydantic 主版本严格匹配，否则 import fastapi 会报
# `pydantic-core X incompatible with pydantic requiring Y`。当前锁定 2.46.4。
pydantic-core = "==2.46.4"

[tool.setuptools.packages.find]
where = ["finfeed"]

[tool.setuptools.package-data]
"finfeed.ui.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
multi_line_output = 3

# ---------------------------------------------------------------------------
# Ruff：静态检查门禁（替代 pyflakes，覆盖 F/E/UP/B 等）
# 目标：提交前拦截 undefined-name(F821) / unused-import(F401) 类问题，
# 防止出现如 xinhua.py 缺失 CNFIN_* 导入导致整源静默失败的回归。
# 运行：python -m ruff check .   /   格式化：python -m ruff format .
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["finfeed", "tests"]

[tool.ruff.lint]
# 当前门禁聚焦「防回归 / 基础卫生」：
#   F=pyflakes(含 F821 未定义名 / F401 未用导入) —— 直接拦住 Bug 1 类缺失导入
#   E/W=pycodestyle 基础风格；I=import 排序
# 注：UP(pyupgrade: List->list / Optional->X|None)、B(bugbear)、C4、SIM 暂未纳入强制，
# 因其会在全仓触发大量现代化改写，宜在独立「现代化专项」PR 中分批处理，避免本门禁被噪音淹没。
select = ["F", "E", "W", "I"]
ignore = [
    "E501",  # 行长交由 black 管理，ruff 不重复报错
]

[tool.ruff.lint.per-file-ignores]
# 测试文件容忍更宽松的风格与"宽泛 except"
"tests/*" = ["B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"