[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finfeed"
version = "2.1.0"
description = "实时金融新闻监控系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FinFeed Team" }]

[project.scripts]
finfeed = "finfeed.cli:main"

[project.urls]
"Homepage" = "https://github.com/finfeed/finfeed"
"Bug Tracker" = "https://github.com/finfeed/finfeed/issues"

[project.dependencies]
httpx = ">=0.28.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=4.9.0"
rich = ">=13.0.0"
playwright = ">=1.40.0"
openpyxl = ">=3.1.0"
# --- 通达信行情（easy-tdx 集成 + 资金流大屏模块） ---
easy-tdx = ">=1.20"
# --- 股票监控：名称/拼音简称导入解析 ---
pypinyin = ">=0.50"
# --- 方案 D 新 Web 后端（双轨并行） ---
fastapi = ">=0.110"
uvicorn = ">=0.27"
pydantic = ">=2.13,<3"
# pydantic-core 需与 pydantic 主版本严格匹配，否则 import fastapi 会报
# `pydantic-core X incompatible with pydantic requiring Y`。当前锁定 2.46.4。
pydantic-core = "==2.46.4"

[project.optional-dependencies]
# 开发/CI 工具链：ruff 代码检查、import-linter 分层契约、pytest 测试
dev = [
    "ruff>=0.6",
    "import-linter>=2.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["finfeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
multi_line_output = 3

# ---------------------------------------------------------------------------
# Ruff：静态检查门禁（替代 pyflakes，覆盖 F/E/UP/B 等）
# 目标：提交前拦截 undefined-name(F821) / unused-import(F401) 类问题，
# 防止出现如 xinhua.py 缺失 CNFIN_* 导入导致整源静默失败的回归。
# 运行：python -m ruff check .   /   格式化：python -m ruff format .
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["finfeed", "tests"]

[tool.ruff.lint]
# 当前门禁聚焦「防回归 / 基础卫生」：
#   F=pyflakes(含 F821 未定义名 / F401 未用导入) —— 直接拦住 Bug 1 类缺失导入
#   E/W=pycodestyle 基础风格；I=import 排序
# 注：UP(pyupgrade: List->list / Optional->X|None)、B(bugbear)、C4、SIM 暂未纳入强制，
# 因其会在全仓触发大量现代化改写，宜在独立「现代化专项」PR 中分批处理，避免本门禁被噪音淹没。
select = ["F", "E", "W", "I"]
ignore = [
    "E501",  # 行长交由 black 管理，ruff 不重复报错
]

[tool.ruff.lint.per-file-ignores]
# 测试文件容忍更宽松的风格与"宽泛 except"
"tests/*" = ["B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Import Linter：架构分层契约（架构护栏）
#
# 背景：AST 全量解析检出 72 条包级依赖边中存在 15 个环，最大环串联 7 个包
#   analysis → market → core → alerts → stock_monitor → llm → storage → analysis
# 依赖环不是被设计解决的，而是被「函数内延迟导入 + __init__ 重 import 副作用」
# 掩盖的，因此静态检查此前从未生效。
#
# 策略（冻结现状，逐步收敛）：
#   1. 先定义目标分层，把存量违反全部登记进白名单，让 CI 立即可通过；
#   2. 此后任何「新增」的违规 import 都会让 CI 失败，债务停止增长；
#   3. 每解一个环，就从白名单划掉一条，进度可量化。
#
# 运行：python -m importlinter.cli lint  （或 lint-imports）
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "finfeed"
# 分层契约只覆盖核心主干；未列出的包（如一次性脚本）不参与检查
include_external_packages = false

[[tool.importlinter.contracts]]
name = "分层架构：cli > ui > application > domain > storage > shared"
type = "layers"
# 分隔符语义（import-linter 专属）：
#   `:` = 同层模块「允许」互相 import（non-independent）
#   `|` = 同层模块「禁止」互相 import（independent）
# domain 层内 12 个包彼此协作，用 `:`；底层 utils/config 应互不依赖，用 `|`。
layers = [
    "finfeed.cli",
    "finfeed.ui",
    "finfeed.application",
    "finfeed.core : finfeed.market : finfeed.analysis : finfeed.llm : finfeed.alerts : finfeed.screener : finfeed.ecal : finfeed.stock_monitor : finfeed.capital_dashboard : finfeed.sector_minute : finfeed.integrations : finfeed.f10 : finfeed.content_extractor : finfeed.content_fetch",
    "finfeed.storage",
    "finfeed.utils | finfeed.config",
]
exhaustive = false