<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="FinFeed — 实时财经新闻监控、舆情情绪量化与事件日历平台。" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b121e" media="(prefers-color-scheme: dark)" />

    <!-- Brand assets -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinFeed 实时财经新闻监控" />
    <meta property="og:description" content="多源聚合 · 情绪量化 · 事件日历 · AI 解读" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Web 字体：自托管可变字体（src/styles/fonts.css + public/fonts/）。
         Inter（西文/界面）+ JetBrains Mono（数据等宽），latin 子集共约 80KB，
         display=swap 不阻塞渲染；中文走系统字体栈（tokens.css --ff-font-sans）。 -->

    <title>FinFeed 实时财经新闻监控</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
